name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate project files
        run: |
          cat > settings.gradle.kts << 'KBEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SmartKeyboard"
          include(":app")
          KBEOF
          cat > build.gradle.kts << 'KBEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          KBEOF
          cat > gradle.properties << 'KBEOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          KBEOF
          mkdir -p app
          cat > app/build.gradle.kts << 'KBEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.mohsenm.smartkeyboard"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.mohsenm.smartkeyboard"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              // فعلاً وابستگی لازم نیست؛ بعداً Room و ... اضافه می‌شود
          }
          KBEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'KBEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- عمداً پرمیشن INTERNET نداریم: داده‌ها از گوشی خارج نمی‌شوند -->
              <application
                  android:label="@string/app_name"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <service
                      android:name=".SmartKeyboardService"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          KBEOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/method.xml << 'KBEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android">
              <subtype
                  android:label="فارسی"
                  android:imeSubtypeLocale="fa_IR"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          KBEOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml << 'KBEOF'
          <resources>
              <string name="app_name">کیبورد هوشمند</string>
          </resources>
          KBEOF
          mkdir -p app/src/main/java/com/mohsenm/smartkeyboard
          cat > app/src/main/java/com/mohsenm/smartkeyboard/PhraseStore.kt << 'KBEOF'
          package com.mohsenm.smartkeyboard

          import android.content.Context
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper

          /** حافظه‌ی لوکال جمله‌ها؛ فقط روی همین گوشی ذخیره می‌شود. */
          class PhraseStore(context: Context) : SQLiteOpenHelper(context, "phrases.db", null, 1) {

              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL(
                      "CREATE TABLE phrases (text TEXT PRIMARY KEY, cnt INTEGER NOT NULL, last INTEGER NOT NULL)"
                  )
              }

              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {}

              fun learn(text: String) {
                  val now = System.currentTimeMillis()
                  val db = writableDatabase
                  db.execSQL("UPDATE phrases SET cnt = cnt + 1, last = ? WHERE text = ?", arrayOf<Any>(now, text))
                  db.execSQL("INSERT OR IGNORE INTO phrases(text, cnt, last) VALUES(?, 1, ?)", arrayOf<Any>(text, now))
              }

              fun suggest(prefix: String, limit: Int): List<String> {
                  val escaped = prefix
                      .replace("\\", "\\\\")
                      .replace("%", "\\%")
                      .replace("_", "\\_")
                  val out = ArrayList<String>()
                  readableDatabase.rawQuery(
                      "SELECT text FROM phrases WHERE text LIKE ? ESCAPE '\\' AND text != ? " +
                          "ORDER BY cnt DESC, last DESC LIMIT ?",
                      arrayOf("$escaped%", prefix, limit.toString())
                  ).use { c ->
                      while (c.moveToNext()) out.add(c.getString(0))
                  }
                  return out
              }
          }
          KBEOF
          mkdir -p app/src/main/java/com/mohsenm/smartkeyboard
          cat > app/src/main/java/com/mohsenm/smartkeyboard/SmartKeyboardService.kt << 'KBEOF'
          package com.mohsenm.smartkeyboard

          import android.inputmethodservice.InputMethodService
          import android.text.InputType
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView

          class SmartKeyboardService : InputMethodService() {

              companion object {
                  private const val SENTENCE_END = ".؟?!"
                  private val LONG_DIGITS = Regex("[0-9۰-۹٠-٩]{7,}")

                  // چیدمان مثل کیبورد سامسونگ (از چپ به راست)
                  private val FA_ROWS = listOf("صثقفعهخحجچ", "شسیبلاتنمپ", "طزرودکگ")
                  private val EN_ROWS = listOf("qwertyuiop", "asdfghjkl", "zxcvbnm")

                  // حروف کم‌کاربرد: با نگه‌داشتن کلید یا با شیفت وارد می‌شوند
                  private val FA_ALT = mapOf(
                      'ص' to 'ض', 'ع' to 'غ', 'ی' to 'ئ', 'ا' to 'آ',
                      'ط' to 'ظ', 'ز' to 'ژ', 'د' to 'ذ', 'و' to 'ؤ', 'گ' to 'ء'
                  )
              }

              private var learningEnabled = true
              private var lang = "fa"        // "fa" یا "en"
              private var shift = false

              private lateinit var suggestionBar: LinearLayout
              private lateinit var keysArea: LinearLayout
              private val store by lazy { PhraseStore(applicationContext) }

              private val fa get() = lang == "fa"

              override fun onCreateInputView(): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xFF263238.toInt())
                  }

                  // نوار پیشنهاد
                  suggestionBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                  }
                  root.addView(suggestionBar, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, dp(44)
                  ))

                  // محل نمایش صفحه‌ی کلیدها؛ چیدمان از چپ به راست مثل کیبورد واقعی
                  keysArea = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutDirection = View.LAYOUT_DIRECTION_LTR
                  }
                  root.addView(keysArea)

                  showLetters()
                  return root
              }

              override fun onStartInputView(info: EditorInfo?, restarting: Boolean) {
                  super.onStartInputView(info, restarting)
                  // در فیلد رمز عبور و فیلدهای حساس یادگیری خاموش است
                  learningEnabled = !isSensitiveField(info)

                  // در فیلدهای عددی/تلفن مستقیم صفحه‌ی اعداد باز می‌شود
                  if (::keysArea.isInitialized) {
                      val cls = (info?.inputType ?: 0) and InputType.TYPE_MASK_CLASS
                      if (cls == InputType.TYPE_CLASS_NUMBER || cls == InputType.TYPE_CLASS_PHONE) {
                          showNumbers()
                      } else {
                          showLetters()
                      }
                  }
                  updateSuggestions()
              }

              private fun isSensitiveField(info: EditorInfo?): Boolean {
                  val type = info?.inputType ?: return true
                  val cls = type and InputType.TYPE_MASK_CLASS
                  val variation = type and InputType.TYPE_MASK_VARIATION
                  return when (cls) {
                      InputType.TYPE_CLASS_TEXT ->
                          variation == InputType.TYPE_TEXT_VARIATION_PASSWORD ||
                          variation == InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD ||
                          variation == InputType.TYPE_TEXT_VARIATION_WEB_PASSWORD
                      InputType.TYPE_CLASS_NUMBER -> variation == InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      else -> false
                  }
              }

              // ---- صفحه‌ی حروف ----
              private fun showLetters() {
                  keysArea.removeAllViews()
                  val rows = if (fa) FA_ROWS else EN_ROWS

                  keysArea.addView(letterRow(rows[0], 0f))
                  keysArea.addView(letterRow(rows[1], if (fa) 0f else 0.5f))

                  // ردیف سوم: شیفت + حروف + پاک‌کردن
                  val r3 = newRow(50)
                  val shiftKey = key(if (shift) "⬆" else "⇧", 20f) { shift = !shift; showLetters() }
                  if (shift) shiftKey.setBackgroundColor(0xFF90A4AE.toInt())
                  r3.addView(shiftKey, weight(1.5f))
                  rows[2].forEach { r3.addView(letterKey(it), weight(1f)) }
                  r3.addView(key("⌫", 20f) { backspace() }, weight(1.5f))
                  keysArea.addView(r3)

                  // ردیف پایین
                  val b = newRow(50)
                  b.addView(key(if (fa) "۱۲۳" else "123", 15f) { showNumbers() }, weight(1.3f))
                  b.addView(key("🌐", 18f) {
                      lang = if (fa) "en" else "fa"
                      shift = false
                      showLetters()
                  }, weight(1.1f))
                  b.addView(keyWithAlt(if (fa) "،" else ",", "!", 20f) { type(if (fa) "،" else ",") }, weight(1f))
                  if (fa) b.addView(key("نیم‌فاصله", 11f) { type("\u200c") }, weight(1.6f))
                  b.addView(key(if (fa) "فارسی" else "English", 15f) { type(" ") }, weight(if (fa) 3f else 4.6f))
                  b.addView(keyWithAlt(".", if (fa) "؟" else "?", 20f) { type(".") }, weight(1f))
                  b.addView(key("↵", 20f) { enter() }, weight(1.5f))
                  keysArea.addView(b)
              }

              private fun letterRow(chars: String, spacer: Float): LinearLayout {
                  val line = newRow(50)
                  if (spacer > 0f) line.addView(View(this), weight(spacer))
                  chars.forEach { line.addView(letterKey(it), weight(1f)) }
                  if (spacer > 0f) line.addView(View(this), weight(spacer))
                  return line
              }

              private fun letterKey(base: Char): View {
                  val alt = if (fa) FA_ALT[base] else null
                  val shown: Char = when {
                      !fa -> if (shift) base.uppercaseChar() else base
                      shift && alt != null -> alt
                      else -> base
                  }
                  // اگر شیفت روشن است، دیگر حرف جایگزین جداگانه نشان داده نمی‌شود
                  val hint = if (alt != null && !shift) alt.toString() else null
                  return keyWithAlt(shown.toString(), hint, 20f) {
                      type(shown.toString())
                      if (shift) { shift = false; showLetters() }
                  }
              }

              /** کلید با حرف جایگزین: نگه‌داشتن کلید، حرف کوچک گوشه‌ی کلید را وارد می‌کند. */
              private fun keyWithAlt(label: String, alt: String?, size: Float, onClick: () -> Unit): View {
                  val btn = key(label, size, onClick)
                  if (alt == null) return btn
                  btn.setOnLongClickListener { type(alt); true }
                  val frame = FrameLayout(this)
                  frame.addView(btn, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT
                  ))
                  frame.addView(TextView(this).apply {
                      text = alt
                      textSize = 10f
                      setTextColor(0xFF607D8B.toInt())
                  }, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT,
                      Gravity.TOP or Gravity.END
                  ).apply { setMargins(0, dp(2), dp(6), 0) })
                  return frame
              }

              // ---- صفحه‌ی اعداد (درشت) ----
              private fun showNumbers() {
                  keysArea.removeAllViews()
                  val h = 66
                  val ts = 30f
                  val d = if (fa) "۱۲۳۴۵۶۷۸۹۰" else "1234567890"
                  val comma = if (fa) "،" else ","

                  fun digitRow(a: Char, b: Char, c: Char, lastLabel: String, lastAction: () -> Unit) {
                      val line = newRow(h)
                      line.addView(key(a.toString(), ts) { type(a.toString()) }, weight(1f))
                      line.addView(key(b.toString(), ts) { type(b.toString()) }, weight(1f))
                      line.addView(key(c.toString(), ts) { type(c.toString()) }, weight(1f))
                      line.addView(key(lastLabel, if (lastLabel.length > 1) 18f else ts) { lastAction() }, weight(1f))
                      keysArea.addView(line)
                  }

                  digitRow(d[0], d[1], d[2], "⌫") { backspace() }
                  digitRow(d[3], d[4], d[5], "↵") { enter() }
                  digitRow(d[6], d[7], d[8], if (fa) "فاصله" else "space") { type(" ") }

                  val last = newRow(h)
                  last.addView(key(if (fa) "ابج" else "ABC", 18f) { showLetters() }, weight(1f))
                  last.addView(key(comma, ts) { type(comma) }, weight(1f))
                  last.addView(key(d[9].toString(), ts) { type(d[9].toString()) }, weight(1f))
                  last.addView(key(".", ts) { type(".") }, weight(1f))
                  keysArea.addView(last)
              }

              // ---- ورودی ----
              private fun type(text: String) {
                  // پایان جمله: جمله‌ی تمام‌شده را یاد بگیر
                  if (text.length == 1 && SENTENCE_END.contains(text[0])) learnCurrentSegment()
                  currentInputConnection?.commitText(text, 1)
                  updateSuggestions()
              }

              private fun backspace() {
                  currentInputConnection?.deleteSurroundingText(1, 0)
                  updateSuggestions()
              }

              private fun enter() {
                  learnCurrentSegment()
                  currentInputConnection?.apply {
                      sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER))
                      sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER))
                  }
                  updateSuggestions()
              }

              // ---- یادگیری ----
              /** متن جمله‌ی جاری: از آخرین نقطه/علامت پایان جمله یا خط جدید تا مکان‌نما */
              private fun currentSegment(before: String): String {
                  val idx = before.indexOfLast { it == '\n' || SENTENCE_END.contains(it) }
                  return if (idx >= 0) before.substring(idx + 1) else before
              }

              private fun isLearnable(s: String): Boolean {
                  if (s.length < 6 || s.length > 120) return false
                  if (LONG_DIGITS.containsMatchIn(s)) return false   // شماره کارت/تلفن و ... یاد گرفته نشود
                  if (s.contains('@') || s.contains("http", ignoreCase = true)) return false
                  return true
              }

              private fun learnCurrentSegment() {
                  if (!learningEnabled) return
                  val before = currentInputConnection?.getTextBeforeCursor(200, 0)?.toString() ?: return
                  val seg = currentSegment(before).trim()
                  if (isLearnable(seg)) store.learn(seg)
              }

              // ---- پیشنهادها ----
              private fun updateSuggestions() {
                  if (!::suggestionBar.isInitialized) return
                  suggestionBar.removeAllViews()
                  if (!learningEnabled) return

                  val before = currentInputConnection?.getTextBeforeCursor(200, 0)?.toString().orEmpty()
                  val prefix = currentSegment(before).trimStart()
                  if (prefix.length < 2) return

                  store.suggest(prefix, 3).forEach { s ->
                      suggestionBar.addView(TextView(this).apply {
                          text = s
                          setTextColor(0xFFFFFFFF.toInt())
                          setBackgroundColor(0xFF37474F.toInt())
                          textSize = 15f
                          gravity = Gravity.CENTER
                          maxLines = 1
                          ellipsize = TextUtils.TruncateAt.END
                          setPadding(dp(8), 0, dp(8), 0)
                          setOnClickListener { applySuggestion(s) }
                      }, weight(1f))
                  }
              }

              private fun applySuggestion(phrase: String) {
                  val ic = currentInputConnection ?: return
                  val before = ic.getTextBeforeCursor(200, 0)?.toString().orEmpty()
                  val seg = currentSegment(before)
                  val lead = seg.takeWhile { it == ' ' }
                  ic.deleteSurroundingText(seg.length, 0)
                  ic.commitText(lead + phrase, 1)
                  updateSuggestions()
              }

              // ---- ابزارهای UI ----
              private fun newRow(heightDp: Int) = LinearLayout(this).apply {
                  orientation = LinearLayout.HORIZONTAL
                  layoutDirection = View.LAYOUT_DIRECTION_LTR
                  layoutParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, dp(heightDp)
                  )
              }

              private fun key(label: String, size: Float, onClick: () -> Unit) = Button(this).apply {
                  text = label
                  isAllCaps = false
                  textSize = size
                  minWidth = 0
                  minimumWidth = 0
                  minHeight = 0
                  minimumHeight = 0
                  setPadding(0, 0, 0, 0)
                  setOnClickListener { onClick() }
              }

              private fun weight(w: Float) =
                  LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, w).apply {
                      setMargins(dp(2), dp(2), dp(2), dp(2))
                  }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
          }
          KBEOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: smart-keyboard-apk
          path: app/build/outputs/apk/debug/*.apk
