                  }
              }

              private fun listenerEnabled(): Boolean {
                  val s = Settings.Secure.getString(contentResolver, "enabled_notification_listeners") ?: return false
                  return s.contains(packageName)
              }

              // ---------- ابزارهای ساخت UI ----------
              private fun section(t: String) {
                  content.addView(TextView(this).apply {
                      text = t
                      setTextColor(KbSettings.accentColor(this@SettingsActivity))
                      textSize = 14f
                      setPadding(dp(6), dp(14), dp(6), dp(6))
                  })
              }

              private fun card(fill: LinearLayout.() -> Unit) {
                  val c = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(12), dp(10), dp(12), dp(12))
                      background = GradientDrawable().apply {
                          setColor(cCard)
                          cornerRadius = dp(14).toFloat()
                      }
                  }
                  c.fill()
                  content.addView(c, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT
                  ))
              }

              private fun label(t: String) = TextView(this).apply {
                  text = t
                  setTextColor(cText)
                  textSize = 14f
                  setPadding(dp(4), dp(8), dp(4), dp(6))
              }

              private fun switchRow(t: String, on: Boolean, onChange: (Boolean) -> Unit): View {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(4), dp(8), dp(4), dp(8))
                  }
                  row.addView(TextView(this).apply {
                      text = t
                      setTextColor(cText)
                      textSize = 15f
                  }, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  row.addView(Switch(this).apply {
                      isChecked = on
                      setOnCheckedChangeListener { _, v -> onChange(v) }
                  })
                  return row
              }

              private fun actionButton(t: String, onClick: () -> Unit) = Button(this).apply {
                  text = t
                  isAllCaps = false
                  textSize = 14f
                  setTextColor(0xFFFFFFFF.toInt())
                  background = GradientDrawable().apply {
                      setColor(KbSettings.accentColor(this@SettingsActivity))
                      cornerRadius = dp(10).toFloat()
                  }
                  stateListAnimator = null
                  setOnClickListener { onClick() }
                  layoutParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, dp(46)
                  ).apply { setMargins(0, dp(4), 0, dp(4)) }
              }

              /** ردیف گزینه‌ها؛ در صورت زیاد بودن، در چند خط شکسته می‌شود. */
              private fun choiceRow(options: List<String>, selected: Int, onPick: (Int) -> Unit): View {
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val buttons = ArrayList<Button>()
                  var current = selected
                  fun paint() {
                      buttons.forEachIndexed { i, b ->
                          val sel = i == current
                          b.background = GradientDrawable().apply {
                              setColor(if (sel) KbSettings.accentColor(this@SettingsActivity) else cChip)
                              cornerRadius = dp(10).toFloat()
                          }
                          b.setTextColor(if (sel) 0xFFFFFFFF.toInt() else cText)
                      }
                  }
                  val perLine = if (options.size > 4) 3 else options.size
                  options.chunked(perLine).forEachIndexed { chunkIdx, chunk ->
                      val line = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      chunk.forEachIndexed { k, name ->
                          val idx = chunkIdx * perLine + k
                          val b = Button(this).apply {
                              text = name
                              isAllCaps = false
                              textSize = 13f
                              minWidth = 0
                              minimumWidth = 0
                              minHeight = 0
                              minimumHeight = 0
                              stateListAnimator = null
                              setPadding(dp(4), 0, dp(4), 0)
                              setOnClickListener {
                                  current = idx
                                  paint()
                                  onPick(idx)
                              }
                          }
                          buttons.add(b)
                          line.addView(b, LinearLayout.LayoutParams(0, dp(42), 1f).apply { setMargins(dp(3), dp(3), dp(3), dp(3)) })
                      }
                      box.addView(line)
                  }
                  paint()
                  return box
              }

              private fun accentRow(): View {
                  val line = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setPadding(0, dp(4), 0, dp(6))
                  }
                  val current = KbSettings.accentIndex(this)
                  KbSettings.ACCENT_LABELS.indices.forEach { i ->
                      val dot = TextView(this).apply {
                          gravity = Gravity.CENTER
                          text = if (i == current) "✓" else ""
                          setTextColor(0xFFFFFFFF.toInt())
                          textSize = 18f
                          background = GradientDrawable().apply {
                              shape = GradientDrawable.OVAL
                              setColor(KbSettings.accentColorAt(i))
                          }
                          setOnClickListener {
                              KbSettings.setAccent(this@SettingsActivity, i)
                              build()
                          }
                      }
                      line.addView(dot, LinearLayout.LayoutParams(dp(44), dp(44)).apply { setMargins(dp(8), 0, dp(8), 0) })
                  }
                  return line
              }
          }
          KBEOF
          mkdir -p app/src/main/java/com/mohsenm/smartkeyboard
          cat > app/src/main/java/com/mohsenm/smartkeyboard/CodeInbox.kt << 'KBEOF'
          package com.mohsenm.smartkeyboard

          /** کدها و شماره‌هایی که از اعلان‌ها پیدا شده‌اند؛ فقط در حافظه‌ی گوشی و فقط چند دقیقه نگه‌داشته می‌شوند. */
          object CodeInbox {
              class Item(val value: String, val kind: String, val ts: Long)

              private const val KEEP_MS = 10 * 60 * 1000L
              private const val FRESH_MS = 2 * 60 * 1000L

              private val items = ArrayList<Item>()
              private var dismissedAt = 0L

              /** وقتی کد تازه‌ای رسید، کیبورد صدا زده می‌شود تا نوار بالا را تازه کند. */
              @Volatile var onNew: (() -> Unit)? = null

              @Synchronized
              fun add(value: String, kind: String) {
                  val now = System.currentTimeMillis()
                  items.removeAll { it.value == value }
                  items.add(0, Item(value, kind, now))
                  while (items.size > 8) items.removeAt(items.size - 1)
                  onNew?.invoke()
              }

              @Synchronized
              fun recent(): List<Item> {
                  val limit = System.currentTimeMillis() - KEEP_MS
                  items.removeAll { it.ts < limit }
                  return ArrayList(items)
              }

              /** موردهای خیلی تازه که هنوز کنار زده نشده‌اند (برای نمایش خودکار روی نوار بالا) */
              @Synchronized
              fun fresh(): List<Item> {
                  val limit = maxOf(System.currentTimeMillis() - FRESH_MS, dismissedAt)
                  return recent().filter { it.ts > limit }
              }

              @Synchronized fun dismissFresh() { dismissedAt = System.currentTimeMillis() }

              @Synchronized fun remove(value: String) { items.removeAll { it.value == value } }

              @Synchronized fun clear() { items.clear() }
          }

          /** پیدا کردن کد (مثل رمز یک‌بارمصرف) و شماره (تلفن، کارت، حساب…) از متن اعلان */
          object CodeExtractor {
              private val KEYWORDS = Regex(
                  "کد|رمز|پین|تایید|تأیید|تاييد|پویا|code|otp|pin|verification|password|passcode",
                  RegexOption.IGNORE_CASE
              )
              private val CARD = Regex("""(?<!\d)(\d{4}[ -]\d{4}[ -]\d{4}[ -]\d{4})(?!\d)""")
              private val NUM = Regex("""(?<![\d/:])\d{4,16}(?![\d/:])""")

              private fun normalizeDigits(s: String): String = buildString {
                  for (ch in s) {
                      append(
                          when (ch) {
                              in '۰'..'۹' -> '0' + (ch - '۰')
                              in '٠'..'٩' -> '0' + (ch - '٠')
                              else -> ch
                          }
                      )
                  }
              }

              /** فهرست (مقدار، نوع)؛ نوع یا «کد» است یا «شماره» */
              fun extract(raw: String): List<Pair<String, String>> {
                  var text = normalizeDigits(raw)
                  val hasKw = KEYWORDS.containsMatchIn(text)
                  val out = ArrayList<Pair<String, String>>()

                  for (m in CARD.findAll(text)) {
                      out.add(m.groupValues[1].filter { it.isDigit() } to "شماره")
                  }
                  text = CARD.replace(text, " ")

                  for (m in NUM.findAll(text)) {
                      val v = m.value
                      when {
                          v.length <= 8 && hasKw -> out.add(v to "کد")
                          v.length >= 8 -> out.add(v to "شماره")
                      }
                  }
                  // کدها اول بیایند
                  return out.distinctBy { it.first }.sortedBy { if (it.second == "کد") 0 else 1 }.take(3)
              }
          }
          KBEOF
          mkdir -p app/src/main/java/com/mohsenm/smartkeyboard
          cat > app/src/main/java/com/mohsenm/smartkeyboard/CodeListenerService.kt << 'KBEOF'
          package com.mohsenm.smartkeyboard

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.PersistableBundle
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.widget.Toast

          /**
           * متن اعلان‌های رسیده (پیامک، تلگرام، بانک…) را می‌خواند، کد یا شماره را پیدا می‌کند و
           * یک اعلان کوچک «ضربه بزن تا کپی شود» نشان می‌دهد. چیزی ذخیره یا ارسال نمی‌شود.
           */
          class CodeListenerService : NotificationListenerService() {

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  try {
                      sbn ?: return
                      if (sbn.packageName == packageName) return
                      if (!KbSettings.codes(this)) return
                      val n = sbn.notification ?: return
                      if (n.flags and Notification.FLAG_GROUP_SUMMARY != 0) return
                      if (n.flags and Notification.FLAG_ONGOING_EVENT != 0) return

                      val ex = n.extras ?: return
                      val text = listOfNotNull(
                          ex.getCharSequence(Notification.EXTRA_TITLE),
                          ex.getCharSequence(Notification.EXTRA_TEXT),
                          ex.getCharSequence(Notification.EXTRA_BIG_TEXT)
                      ).joinToString("\n")
                      if (text.isBlank()) return

                      val found = CodeExtractor.extract(text)
                      if (found.isEmpty()) return
                      found.forEach { CodeInbox.add(it.first, it.second) }
                      if (KbSettings.codeNotify(this)) postCopyNotification(found[0].first, found[0].second)
                  } catch (e: Exception) {
                      // خطا در یک اعلان نباید سرویس را از کار بیندازد
                  }
              }

              private fun postCopyNotification(value: String, kind: String) {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(
                          NotificationChannel(CopyReceiver.CHANNEL, "کپی سریع کد و شماره", NotificationManager.IMPORTANCE_HIGH)
                      )
                  }
                  val id = value.hashCode()
                  val intent = Intent(this, CopyReceiver::class.java)
                      .putExtra("v", value).putExtra("k", kind).putExtra("id", id)
                  val pi = PendingIntent.getBroadcast(
                      this, id, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val b = if (Build.VERSION.SDK_INT >= 26) Notification.Builder(this, CopyReceiver.CHANNEL)
                  else @Suppress("DEPRECATION") Notification.Builder(this).setPriority(Notification.PRIORITY_HIGH)
                  b.setSmallIcon(android.R.drawable.ic_menu_edit)
                      .setContentTitle("$kind: $value")
                      .setContentText("ضربه بزن تا کپی شود")
                      .setContentIntent(pi)
                      .setAutoCancel(true)
                      .setOnlyAlertOnce(true)
                  if (Build.VERSION.SDK_INT >= 26) b.setTimeoutAfter(2 * 60 * 1000L)
                  try { nm.notify(id, b.build()) } catch (e: Exception) { }
              }
          }

          /** با ضربه روی اعلان، مقدار در کلیپ‌بورد قرار می‌گیرد. */
          class CopyReceiver : BroadcastReceiver() {
              companion object { const val CHANNEL = "codes" }

              override fun onReceive(context: Context, intent: Intent) {
                  val v = intent.getStringExtra("v") ?: return
                  val kind = intent.getStringExtra("k").orEmpty()
                  try {
                      val cm = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val clip = ClipData.newPlainText("code", v)
                      if (Build.VERSION.SDK_INT >= 33) {
                          // اندروید پیش‌نمایش را مخفی می‌کند و تاریخچه‌ی کیبورد هم آن را ذخیره نمی‌کند
                          clip.description.extras = PersistableBundle().apply {
                              putBoolean("android.content.extra.IS_SENSITIVE", true)
                          }
                      }
                      cm.setPrimaryClip(clip)
                      val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.cancel(intent.getIntExtra("id", 0))
                      Toast.makeText(context, "✓ $kind کپی شد: $v", Toast.LENGTH_SHORT).show()
                  } catch (e: Exception) { }
              }
          }
          KBEOF

      - name: Download word lists (dictionary for swipe typing)
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL "https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/fa/fa_50k.txt" -o app/src/main/assets/words_fa.txt || curl -fsSL "https://huggingface.co/datasets/StephanAkkerman/frequency-words-2018/resolve/main/fa/fa_50k.txt" -o app/src/main/assets/words_fa.txt || echo "Persian word list NOT downloaded"
          curl -fsSL "https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/en/en_50k.txt" -o app/src/main/assets/words_en.txt || curl -fsSL "https://huggingface.co/datasets/StephanAkkerman/frequency-words-2018/resolve/main/en/en_50k.txt" -o app/src/main/assets/words_en.txt || echo "English word list NOT downloaded"
          wc -l app/src/main/assets/*.txt || true

