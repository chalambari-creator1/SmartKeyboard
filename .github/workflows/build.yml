              fun ttlIndex(c: Context) = prefs(c).getInt("clip_ttl_idx", 3).coerceIn(0, TTL_HOURS.size - 1)
              fun setTtl(c: Context, v: Int) = prefs(c).edit().putInt("clip_ttl_idx", v).apply()
              /** ساعت؛ 0 یعنی هرگز پاک نشود */
              fun clipTtlHours(c: Context): Int = TTL_HOURS[ttlIndex(c)]
          }
