              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              // فعلاً وابستگی لازم نیست؛ بعداً Room و ... اضافه می‌شود
          }
          KBEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'KBEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- عمداً پرمیشن INTERNET نداریم: داده‌ها از گوشی خارج نمی‌شوند -->
              <application
