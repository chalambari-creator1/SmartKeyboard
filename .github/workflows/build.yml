              private fun letterRow(chars: String, spacer: Float): LinearLayout {
                  val line = newRow(52)
                  if (spacer > 0f) line.addView(View(this), weight(spacer))
                  chars.forEach { line.addView(letterKey(it), weight(1f)) }
                  if (spacer > 0f) line.addView(View(this), weight(spacer))
                  return line
              }

              private fun letterKey(base: Char): View {
                  val shown: Char = when {
                      !fa -> if (shift) base.uppercaseChar() else base
                      shift -> FA_SHIFT[base] ?: base
                      else -> base
                  }
                  val longChar: Char? = if (fa) FA_LONG[base] else null
                  // حرف کوچک گوشه‌ی کلید: در حالت عادی همان حرف/اعراب لایه‌ی شیفت؛ در لایه‌ی شیفت فقط «ئ» روی «ی»
                  val hintChar: Char? = when {
                      !fa -> null
                      base == 'و' -> null
                      shift -> if (base == 'ی') 'ئ' else null
                      else -> longChar
                  }
                  val v = keyWithAlt(disp(shown), hintChar?.let { disp(it) }, 20f, longChar?.toString()) {
                      type(shown.toString())
                      if (shift) { shift = false; showLetters() }
                  }
                  v.tag = base   // برای تشخیص موقعیت حروف در سوایپ
                  return v
              }

              /** کلید با حرف جایگزین: نگه‌داشتن کلید، حرف کوچک گوشه‌ی کلید را وارد می‌کند. */
              private fun keyWithAlt(
                  label: String, hint: String?, size: Float, longPress: String? = hint, onClick: () -> Unit
              ): View {
                  val btn = key(label, size, false, onClick)
                  if (longPress != null) btn.setOnLongClickListener { type(longPress); true }
                  if (hint == null) return btn
                  val frame = FrameLayout(this)
                  frame.addView(btn, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT
                  ))
                  frame.addView(TextView(this).apply {
                      text = hint
                      textSize = 10f
                      setTextColor(cHint)
                  }, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT,
                      Gravity.TOP or Gravity.START
                  ).apply { setMargins(dp(6), dp(2), 0, 0) })
                  return frame
              }

              // ---- صفحه‌ی اعداد (درشت؛ همیشه اعداد لاتین) ----
              private fun showNumbers() {
                  resetKeys(false)
