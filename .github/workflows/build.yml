  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate project files
        run: |
          cat > settings.gradle.kts << 'KBEOF'
          pluginManagement {
              repositories {
