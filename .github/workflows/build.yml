          KBEOF
          cat > gradle.properties << 'KBEOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          KBEOF
          mkdir -p app
          cat > app/build.gradle.kts << 'KBEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.mohsenm.smartkeyboard"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.mohsenm.smartkeyboard"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
