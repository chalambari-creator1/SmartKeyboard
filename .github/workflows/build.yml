name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate project files
        run: |
          cat > settings.gradle.kts << 'KBEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SmartKeyboard"
          include(":app")
          KBEOF
          cat > build.gradle.kts << 'KBEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          KBEOF
          cat > gradle.properties << 'KBEOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          KBEOF
          mkdir -p app
          cat > app/build.gradle.kts << 'KBEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.mohsenm.smartkeyboard"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.mohsenm.smartkeyboard"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 2
                  versionName = "0.2"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              // فعلاً وابستگی لازم نیست؛ بعداً Room و ... اضافه می‌شود
          }
          KBEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'KBEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- عمداً پرمیشن INTERNET نداریم: داده‌ها از گوشی خارج نمی‌شوند -->
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="@string/app_name"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".SettingsActivity"
                      android:label="@string/app_name"
                      android:theme="@android:style/Theme.Material.NoActionBar"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CodeListenerService"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

                  <receiver
                      android:name=".CopyReceiver"
                      android:exported="false" />

                  <service
                      android:name=".SmartKeyboardService"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          KBEOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/method.xml << 'KBEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="com.mohsenm.smartkeyboard.SettingsActivity">
              <subtype
                  android:label="فارسی"
                  android:imeSubtypeLocale="fa_IR"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          KBEOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml << 'KBEOF'
          <resources>
              <string name="app_name">کیبورد هوشمند</string>
          </resources>
          KBEOF
          mkdir -p app/src/main/java/com/mohsenm/smartkeyboard
          cat > app/src/main/java/com/mohsenm/smartkeyboard/SecretBox.kt << 'KBEOF'
          package com.mohsenm.smartkeyboard

          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import java.security.KeyStore
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.spec.GCMParameterSpec

          /** رمزگذاری با کلیدی که داخل Android Keystore ساخته می‌شود و از گوشی خارج نمی‌شود. */
          object SecretBox {
              private const val ALIAS = "smartkb_vault_key"

              private fun key(): SecretKey {
                  val ks = KeyStore.getInstance("AndroidKeyStore").apply { load(null) }
                  (ks.getKey(ALIAS, null) as? SecretKey)?.let { return it }
                  val kg = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore")
                  kg.init(
                      KeyGenParameterSpec.Builder(
                          ALIAS, KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT
                      )
                          .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                          .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                          .setKeySize(256)
                          .build()
                  )
                  return kg.generateKey()
              }

              fun encrypt(plain: String): ByteArray {
                  val c = Cipher.getInstance("AES/GCM/NoPadding")
                  c.init(Cipher.ENCRYPT_MODE, key())
                  val ct = c.doFinal(plain.toByteArray(Charsets.UTF_8))
                  return c.iv + ct
              }

              fun decrypt(data: ByteArray): String {
                  val iv = data.copyOfRange(0, 12)
                  val c = Cipher.getInstance("AES/GCM/NoPadding")
                  c.init(Cipher.DECRYPT_MODE, key(), GCMParameterSpec(128, iv))
                  return String(c.doFinal(data, 12, data.size - 12), Charsets.UTF_8)
              }
          }
          KBEOF
          mkdir -p app/src/main/java/com/mohsenm/smartkeyboard
          cat > app/src/main/java/com/mohsenm/smartkeyboard/PhraseStore.kt << 'KBEOF'
          package com.mohsenm.smartkeyboard

          import android.content.ContentValues
          import android.content.Context
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper

          /** جمله‌های ذخیره‌شده، کلیپ‌بورد و گاوصندوق؛ فقط روی همین گوشی نگهداری می‌شود. */
          class PhraseStore(context: Context) : SQLiteOpenHelper(context, "phrases.db", null, 5) {

              override fun onCreate(db: SQLiteDatabase) {
                  createPhrases(db)
                  createVault(db)
                  createClips(db)
                  createLearning(db)
              }

              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {
                  if (oldVersion < 2) {
                      db.execSQL("DROP TABLE IF EXISTS phrases")
                      createPhrases(db)
                  }
                  if (oldVersion < 3) {
                      createVault(db)
                      createClips(db)
                  }
                  if (oldVersion == 3) {
                      // پین‌کردن موارد کلیپ‌بورد
                      db.execSQL("ALTER TABLE clips ADD COLUMN pinned INTEGER NOT NULL DEFAULT 0")
                  }
                  if (oldVersion < 5) {
                      createLearning(db)
                  }
              }

              private fun createLearning(db: SQLiteDatabase) {
                  db.execSQL("CREATE TABLE IF NOT EXISTS words (w TEXT PRIMARY KEY, cnt INTEGER NOT NULL, last INTEGER NOT NULL)")
                  db.execSQL(
                      "CREATE TABLE IF NOT EXISTS bigrams (prev TEXT NOT NULL, next TEXT NOT NULL, " +
                          "cnt INTEGER NOT NULL, last INTEGER NOT NULL, PRIMARY KEY(prev, next))"
                  )
                  db.execSQL("CREATE TABLE IF NOT EXISTS sentences (text TEXT PRIMARY KEY, cnt INTEGER NOT NULL, last INTEGER NOT NULL)")
              }

              private fun createPhrases(db: SQLiteDatabase) = db.execSQL(
                  "CREATE TABLE IF NOT EXISTS phrases (text TEXT PRIMARY KEY, cnt INTEGER NOT NULL, last INTEGER NOT NULL)"
              )

              private fun createVault(db: SQLiteDatabase) = db.execSQL(
                  "CREATE TABLE IF NOT EXISTS vault (id INTEGER PRIMARY KEY AUTOINCREMENT, " +
                      "label TEXT NOT NULL, secret BLOB NOT NULL, created INTEGER NOT NULL)"
              )

              private fun createClips(db: SQLiteDatabase) = db.execSQL(
                  "CREATE TABLE IF NOT EXISTS clips (text TEXT PRIMARY KEY, ts INTEGER NOT NULL, pinned INTEGER NOT NULL DEFAULT 0)"
              )

              // ---------- جمله‌های ذخیره‌شده ----------

              /** true اگر جمله‌ی جدیدی اضافه شد، false اگر از قبل بود */
              fun add(text: String): Boolean {
                  val db = writableDatabase
                  db.rawQuery("SELECT 1 FROM phrases WHERE text = ?", arrayOf(text)).use { c ->
                      if (c.moveToFirst()) return false
                  }
                  db.execSQL(
                      "INSERT INTO phrases(text, cnt, last) VALUES(?, 0, ?)",
                      arrayOf<Any>(text, System.currentTimeMillis())
                  )
                  return true
              }

              fun delete(text: String) {
                  writableDatabase.execSQL("DELETE FROM phrases WHERE text = ?", arrayOf<Any>(text))
              }

              /** هر بار که جمله استفاده شد، امتیازش بالا می‌رود تا در پیشنهادها جلوتر بیاید */
              fun use(text: String) {
                  writableDatabase.execSQL(
                      "UPDATE phrases SET cnt = cnt + 1, last = ? WHERE text = ?",
                      arrayOf<Any>(System.currentTimeMillis(), text)
                  )
              }

              fun all(): List<String> {
                  val out = ArrayList<String>()
                  readableDatabase.rawQuery(
                      "SELECT text FROM phrases ORDER BY cnt DESC, last DESC", null
                  ).use { c ->
                      while (c.moveToNext()) out.add(c.getString(0))
                  }
                  return out
              }

              fun suggest(prefix: String, limit: Int): List<String> {
                  val escaped = prefix
                      .replace("\\", "\\\\")
                      .replace("%", "\\%")
                      .replace("_", "\\_")
                  val out = ArrayList<String>()
                  readableDatabase.rawQuery(
                      "SELECT text FROM phrases WHERE text LIKE ? ESCAPE '\\' AND text != ? " +
                          "ORDER BY cnt DESC, last DESC LIMIT ?",
                      arrayOf("$escaped%", prefix, limit.toString())
                  ).use { c ->
                      while (c.moveToNext()) out.add(c.getString(0))
                  }
                  return out
              }

              // ---------- کلیپ‌بورد ----------

              /** کپی جدید را اضافه می‌کند (اگر قبلاً بوده، فقط زمانش تازه می‌شود و پینش حفظ می‌شود). */
              fun clipAdd(text: String, ttlHours: Int = 0) {
                  val db = writableDatabase
                  val now = System.currentTimeMillis()
                  db.execSQL("INSERT OR IGNORE INTO clips(text, ts, pinned) VALUES(?, ?, 0)", arrayOf<Any>(text, now))
                  db.execSQL("UPDATE clips SET ts = ? WHERE text = ?", arrayOf<Any>(now, text))
                  // از موارد پین‌نشده فقط ۳۰ مورد آخر نگه داشته می‌شود
                  db.execSQL(
                      "DELETE FROM clips WHERE pinned = 0 AND text NOT IN " +
                          "(SELECT text FROM clips WHERE pinned = 0 ORDER BY ts DESC LIMIT 30)"
                  )
                  clipExpire(ttlHours)
              }

              /** موارد پین‌نشده‌ای که از ttlHours ساعت گذشته‌اند پاک می‌شوند (0 = هرگز). */
              fun clipExpire(ttlHours: Int) {
                  if (ttlHours <= 0) return
                  val limit = System.currentTimeMillis() - ttlHours * 3_600_000L
                  writableDatabase.execSQL("DELETE FROM clips WHERE pinned = 0 AND ts < ?", arrayOf<Any>(limit))
              }

              /** فهرست (متن، پین‌شده؟)؛ پین‌شده‌ها اول می‌آیند. */
              fun clipItems(): List<Pair<String, Boolean>> {
                  val out = ArrayList<Pair<String, Boolean>>()
                  readableDatabase.rawQuery(
                      "SELECT text, pinned FROM clips ORDER BY pinned DESC, ts DESC", null
                  ).use { c ->
                      while (c.moveToNext()) out.add(Pair(c.getString(0), c.getInt(1) == 1))
                  }
                  return out
              }

              fun clipList(): List<String> = clipItems().map { it.first }

              fun clipSetPinned(text: String, pinned: Boolean) {
                  writableDatabase.execSQL(
                      "UPDATE clips SET pinned = ? WHERE text = ?", arrayOf<Any>(if (pinned) 1 else 0, text)
                  )
              }

              fun clipDelete(text: String) {
                  writableDatabase.execSQL("DELETE FROM clips WHERE text = ?", arrayOf<Any>(text))
              }

              /** همه‌ی موارد پین‌نشده را پاک می‌کند؛ پین‌شده‌ها می‌مانند. */
              fun clipClear() {
                  writableDatabase.execSQL("DELETE FROM clips WHERE pinned = 0")
              }

              // ---------- یادگیری از نوشته‌های کاربر (فقط روی همین گوشی) ----------

              private fun likeEscape(s: String) = s.replace("\\", "\\\\").replace("%", "\\%").replace("_", "\\_")

              fun learnWord(w: String) {
                  val now = System.currentTimeMillis()
                  val db = writableDatabase
                  db.execSQL("INSERT OR IGNORE INTO words(w, cnt, last) VALUES(?, 0, ?)", arrayOf<Any>(w, now))
                  db.execSQL("UPDATE words SET cnt = cnt + 1, last = ? WHERE w = ?", arrayOf<Any>(now, w))
              }

              fun learnBigram(prev: String, next: String) {
                  val now = System.currentTimeMillis()
                  val db = writableDatabase
                  db.execSQL("INSERT OR IGNORE INTO bigrams(prev, next, cnt, last) VALUES(?, ?, 0, ?)", arrayOf<Any>(prev, next, now))
                  db.execSQL("UPDATE bigrams SET cnt = cnt + 1, last = ? WHERE prev = ? AND next = ?", arrayOf<Any>(now, prev, next))
              }

              /** تعداد دفعاتی که این جمله نوشته شده (پس از ثبت این بار) */
              fun learnSentence(text: String): Int {
                  val now = System.currentTimeMillis()
                  val db = writableDatabase
                  db.execSQL("INSERT OR IGNORE INTO sentences(text, cnt, last) VALUES(?, 0, ?)", arrayOf<Any>(text, now))
                  db.execSQL("UPDATE sentences SET cnt = cnt + 1, last = ? WHERE text = ?", arrayOf<Any>(now, text))
                  db.rawQuery("SELECT cnt FROM sentences WHERE text = ?", arrayOf(text)).use { c ->
                      if (c.moveToFirst()) return c.getInt(0)
                  }
                  return 0
              }

              /** تکمیل کلمه: فقط کلمه‌هایی که دست‌کم دو بار نوشته شده‌اند (تا غلط‌های تایپی پیشنهاد نشوند) */
              fun suggestWords(prefix: String, limit: Int): List<String> {
                  val out = ArrayList<String>()
                  readableDatabase.rawQuery(
                      "SELECT w FROM words WHERE cnt >= 2 AND w LIKE ? ESCAPE '\\' AND w != ? " +
                          "ORDER BY cnt DESC, last DESC LIMIT ?",
                      arrayOf(likeEscape(prefix) + "%", prefix, limit.toString())
                  ).use { c -> while (c.moveToNext()) out.add(c.getString(0)) }
                  return out
              }

              /** کلمه‌ی بعدی محتمل، بر اساس کلمه‌ی قبلی */
              fun nextWords(prev: String, limit: Int): List<String> {
                  val out = ArrayList<String>()
                  readableDatabase.rawQuery(
                      "SELECT next FROM bigrams WHERE prev = ? AND cnt >= 2 ORDER BY cnt DESC, last DESC LIMIT ?",
                      arrayOf(prev, limit.toString())
                  ).use { c -> while (c.moveToNext()) out.add(c.getString(0)) }
                  return out
              }

              /** پرکاربردترین کلمه‌های کاربر؛ برای سوایپ هم به فرهنگ لغت اضافه می‌شوند */
              fun topWords(limit: Int): List<String> {
                  val out = ArrayList<String>()
                  readableDatabase.rawQuery(
                      "SELECT w FROM words WHERE cnt >= 2 ORDER BY cnt DESC, last DESC LIMIT ?",
                      arrayOf(limit.toString())
                  ).use { c -> while (c.moveToNext()) out.add(c.getString(0)) }
                  return out
              }

              fun wordCount(): Int {
                  readableDatabase.rawQuery("SELECT COUNT(*) FROM words WHERE cnt >= 2", null).use { c ->
                      if (c.moveToFirst()) return c.getInt(0)
                  }
                  return 0
              }

              /** نگه‌داشتن اندازه‌ی داده‌ها: غلط‌های تایپی قدیمی و موارد کم‌اهمیت پاک می‌شوند. */
              fun pruneLearning() {
                  val db = writableDatabase
                  val old = System.currentTimeMillis() - 30L * 24 * 3_600_000
                  db.execSQL("DELETE FROM words WHERE cnt < 2 AND last < ?", arrayOf<Any>(old))
                  db.execSQL("DELETE FROM words WHERE w NOT IN (SELECT w FROM words ORDER BY cnt DESC, last DESC LIMIT 5000)")
                  db.execSQL("DELETE FROM bigrams WHERE cnt < 2 AND last < ?", arrayOf<Any>(old))
                  db.execSQL("DELETE FROM bigrams WHERE rowid NOT IN (SELECT rowid FROM bigrams ORDER BY cnt DESC, last DESC LIMIT 8000)")
                  db.execSQL("DELETE FROM sentences WHERE cnt < 3 AND last < ?", arrayOf<Any>(old))
              }

              fun clearLearning() {
                  val db = writableDatabase
                  db.execSQL("DELETE FROM words")
                  db.execSQL("DELETE FROM bigrams")
                  db.execSQL("DELETE FROM sentences")
              }

              // ---------- گاوصندوق (رمزگذاری‌شده) ----------

              fun vaultAdd(label: String, secret: String) {
                  val cv = ContentValues().apply {
                      put("label", label)
                      put("secret", SecretBox.encrypt(secret))
                      put("created", System.currentTimeMillis())
                  }
                  writableDatabase.insert("vault", null, cv)
              }

              /** فهرست (شناسه، برچسب)؛ خود مقدار محرمانه اینجا خوانده نمی‌شود */
              fun vaultList(): List<Pair<Long, String>> {
                  val out = ArrayList<Pair<Long, String>>()
                  readableDatabase.rawQuery("SELECT id, label FROM vault ORDER BY id DESC", null).use { c ->
                      while (c.moveToNext()) out.add(Pair(c.getLong(0), c.getString(1)))
                  }
                  return out
              }

              fun vaultSecret(id: Long): String? {
                  readableDatabase.rawQuery(
                      "SELECT secret FROM vault WHERE id = ?", arrayOf(id.toString())
                  ).use { c ->
                      if (c.moveToFirst()) {
                          return try { SecretBox.decrypt(c.getBlob(0)) } catch (e: Exception) { null }
                      }
                  }
                  return null
              }

              fun vaultDelete(id: Long) {
                  writableDatabase.execSQL("DELETE FROM vault WHERE id = ?", arrayOf<Any>(id))
              }
          }
          KBEOF
          mkdir -p app/src/main/java/com/mohsenm/smartkeyboard
          cat > app/src/main/java/com/mohsenm/smartkeyboard/SwipeLayout.kt << 'KBEOF'
          package com.mohsenm.smartkeyboard

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PointF
          import android.graphics.RectF
          import android.view.MotionEvent
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import kotlin.math.hypot

          /**
           * صفحه‌ی کلیدها. وقتی انگشت از روی یک حرف شروع به کشیدن کند (بیش از چند میلی‌متر)،
           * لمس‌ها را می‌گیرد، مسیر را رسم می‌کند و در پایان مسیر را برای تشخیص کلمه می‌دهد.
           * ضربه‌ی ساده و نگه‌داشتن کلید مثل قبل کار می‌کنند.
           */
          class SwipeLayout(context: Context) : LinearLayout(context) {

              var swipeEnabled = false
              var trailColor: Int
                  get() = paint.color
                  set(v) { paint.color = (v and 0x00FFFFFF) or 0xAA000000.toInt() }
              var onSwipe: ((List<PointF>, List<Pair<Char, RectF>>) -> Unit)? = null

              private val density = resources.displayMetrics.density
              private val slop = 40f * density

              private val path = ArrayList<PointF>()
              private var swiping = false
              private var armed = false
              private var downX = 0f
              private var downY = 0f

              private val trail = Path()
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 5f * density
                  strokeCap = Paint.Cap.ROUND
                  strokeJoin = Paint.Join.ROUND
                  color = 0xAA2196F3.toInt()
              }

              /** حروفی که تگ دارند (Char) و مستطیل هرکدام در مختصات همین View */
              fun letterKeys(): List<Pair<Char, RectF>> {
                  val out = ArrayList<Pair<Char, RectF>>()
                  for (i in 0 until childCount) {
                      val row = getChildAt(i) as? ViewGroup ?: continue
                      for (j in 0 until row.childCount) {
                          val v = row.getChildAt(j)
                          val c = v.tag as? Char ?: continue
                          out.add(
                              c to RectF(
                                  (row.left + v.left).toFloat(), (row.top + v.top).toFloat(),
                                  (row.left + v.right).toFloat(), (row.top + v.bottom).toFloat()
                              )
                          )
                      }
                  }
                  return out
              }

              private fun hitLetter(x: Float, y: Float) = letterKeys().any { it.second.contains(x, y) }

              private fun addPoints(ev: MotionEvent) {
                  for (h in 0 until ev.historySize) {
                      path.add(PointF(ev.getHistoricalX(h), ev.getHistoricalY(h)))
                  }
                  path.add(PointF(ev.x, ev.y))
              }

              override fun onInterceptTouchEvent(ev: MotionEvent): Boolean {
                  if (!swipeEnabled) return false
                  when (ev.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          swiping = false
                          path.clear()
                          downX = ev.x
                          downY = ev.y
                          armed = hitLetter(ev.x, ev.y)
                          if (armed) path.add(PointF(ev.x, ev.y))
                      }
                      MotionEvent.ACTION_MOVE -> if (armed && !swiping) {
                          addPoints(ev)
                          if (hypot(ev.x - downX, ev.y - downY) > slop) {
                              swiping = true
                              invalidate()
                              return true
                          }
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> armed = false
                  }
                  return swiping
              }

              override fun onTouchEvent(ev: MotionEvent): Boolean {
                  if (!swiping) return super.onTouchEvent(ev)
                  when (ev.actionMasked) {
                      MotionEvent.ACTION_MOVE -> {
                          addPoints(ev)
                          invalidate()
                      }
                      MotionEvent.ACTION_UP -> {
                          addPoints(ev)
                          val pts = ArrayList(path)
                          val keys = letterKeys()
                          swiping = false
                          armed = false
                          path.clear()
                          invalidate()
                          onSwipe?.invoke(pts, keys)
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          swiping = false
                          armed = false
                          path.clear()
                          invalidate()
                      }
                  }
                  return true
              }

              override fun dispatchDraw(canvas: Canvas) {
                  super.dispatchDraw(canvas)
                  if (swiping && path.size > 1) {
                      trail.reset()
                      trail.moveTo(path[0].x, path[0].y)
                      for (i in 1 until path.size) trail.lineTo(path[i].x, path[i].y)
                      canvas.drawPath(trail, paint)
                  }
              }
          }
          KBEOF
          mkdir -p app/src/main/java/com/mohsenm/smartkeyboard
          cat > app/src/main/java/com/mohsenm/smartkeyboard/SwipeDecoder.kt << 'KBEOF'
          package com.mohsenm.smartkeyboard

          import android.content.Context
          import android.graphics.PointF
          import android.graphics.RectF
          import kotlin.math.hypot
          import kotlin.math.ln

          /**
           * تشخیص کلمه از روی مسیر انگشت: شکل مسیر با مسیر ایده‌آل هر کلمه (خط‌های بین مرکز حروف)
           * مقایسه می‌شود. فرهنگ لغت: فایل‌های words_fa.txt / words_en.txt داخل assets (اگر دانلود شده باشند)،
           * فهرست کوچک داخلی، و کلمه‌های جمله‌های ذخیره‌شده‌ی خود کاربر.
           */
          class SwipeDecoder(private val context: Context) {

              private class Entry(val word: String, val keys: String, val rank: Int)

              private val dicts = HashMap<String, List<Entry>>()

              companion object {
                  private const val N = 32

                  // حروف روی صفحه‌کلید فارسی
                  private const val FA_KEYS = "صثقفعهخحجچشسیبلاتنمپطزرودکگ"

                  // حروفی که روی کلید جداگانه نیستند به کلید پایه‌شان نگاشت می‌شوند
                  private val FA_BASE = mapOf(
                      'ض' to 'ص', 'غ' to 'ع', 'ئ' to 'ی', 'ي' to 'ی', 'ى' to 'ی',
                      'آ' to 'ا', 'أ' to 'ا', 'إ' to 'ا', 'ظ' to 'ط', 'ژ' to 'ز',
                      'ذ' to 'د', 'ؤ' to 'و', 'ء' to 'گ', 'ة' to 'ه', 'ك' to 'ک'
                  )

                  private const val BUILTIN_FA =
                      "و در به از که این را با است برای آن یک خود تا کرد بر هم نیز گفت شد دو ما من تو او شما ولی اما " +
                      "اگر چون هر همه بود باید خیلی خوب سلام ممنون خداحافظ لطفا بله نه چی چرا کجا کی چطور الان امروز " +
                      "فردا دیروز شب روز صبح عصر دوست خونه کار پول ماشین کتاب آب نون غذا دکتر بیمارستان بیمار پرستار " +
                      "شیفت تشکر زحمت عزیز خانم آقا برادر خواهر مادر پدر بچه همین همون اینجا اونجا دیگه فقط حتما شاید " +
                      "باشه ببخشید متشکرم سپاس"

                  private const val BUILTIN_EN =
                      "the be to of and in that have it for not on with he as you do at this but his by from they we say " +
                      "her she or an will my one all would there their what so up out if about who get which go me when " +
                      "make can like time no just him know take people into year your good some could them see other " +
                      "than then now look only come its over think also back after use two how our work first well way " +
                      "even new want because any these give day most us is are was were been has had did does hello " +
                      "thanks please yes okay sorry love where why"
              }

              /** رشته‌ی کلیدهای صفحه‌کلید برای یک کلمه؛ null اگر کلمه حرف نامعتبر دارد */
              private fun keysOf(word: String, fa: Boolean): String? {
                  val sb = StringBuilder()
                  for (ch in word) {
                      if (fa) {
                          val b = FA_BASE[ch] ?: ch
                          if (FA_KEYS.indexOf(b) < 0) return null
                          sb.append(b)
                      } else {
                          val c = ch.lowercaseChar()
                          if (c == '\'') continue
                          if (c !in 'a'..'z') return null
                          sb.append(c)
                      }
                  }
                  return if (sb.length >= 2) sb.toString() else null
              }

              @Synchronized
              private fun dict(lang: String): List<Entry> {
                  dicts[lang]?.let { return it }
                  val fa = lang == "fa"
                  val seen = HashSet<String>()
                  val out = ArrayList<Entry>(60000)
                  var rank = 0

                  fun add(raw: String) {
                      val w = raw.trim()
                      if (w.isEmpty() || !seen.add(w)) return
                      val k = keysOf(w, fa) ?: return
                      out.add(Entry(w, k, rank++))
                  }

                  (if (fa) BUILTIN_FA else BUILTIN_EN).split(" ").forEach { add(it) }
                  try {
                      val name = if (fa) "words_fa.txt" else "words_en.txt"
                      context.assets.open(name).bufferedReader(Charsets.UTF_8).useLines { lines ->
                          for (line in lines) add(line.substringBefore(' '))
                      }
                  } catch (e: Exception) {
                      // فایل فرهنگ لغت موجود نیست؛ فقط فهرست داخلی استفاده می‌شود
                  }
                  dicts[lang] = out
                  return out
              }

              private fun pathLength(p: List<PointF>): Float {
                  var s = 0f
                  for (i in 1 until p.size) s += hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y)
                  return s
              }

              /** نمونه‌برداری یکنواخت از مسیر به n نقطه (بر اساس طول مسیر) */
              private fun resample(p: List<PointF>, n: Int): List<PointF> {
                  val total = pathLength(p)
                  if (total == 0f) return List(n) { p[0] }
                  val step = total / (n - 1)
                  val pts = ArrayList(p.map { PointF(it.x, it.y) })
                  val out = ArrayList<PointF>(n)
                  out.add(PointF(pts[0].x, pts[0].y))
                  var d = 0f
                  var i = 1
                  while (i < pts.size) {
                      val a = pts[i - 1]
                      val b = pts[i]
                      val seg = hypot(b.x - a.x, b.y - a.y)
                      if (seg > 0f && d + seg >= step) {
                          val t = (step - d) / seg
                          val q = PointF(a.x + t * (b.x - a.x), a.y + t * (b.y - a.y))
                          out.add(q)
                          pts.add(i, q)
                          d = 0f
                      } else {
                          d += seg
                      }
                      i++
                  }
                  while (out.size < n) out.add(PointF(pts.last().x, pts.last().y))
                  return out.take(n)
              }

              /** تا ۳ کلمه‌ی محتمل، از بهترین به بدترین */
              fun decode(
                  lang: String,
                  path: List<PointF>,
                  keys: List<Pair<Char, RectF>>,
                  extraPhrases: List<String>
              ): List<String> {
                  if (path.size < 2 || keys.isEmpty()) return emptyList()
                  val fa = lang == "fa"

                  val centers = HashMap<Char, PointF>()
                  var wSum = 0f
                  for ((c, r) in keys) {
                      centers[c] = PointF(r.centerX(), r.centerY())
                      wSum += r.width()
                  }
                  val keyW = wSum / keys.size

                  val userLen = pathLength(path)
                  if (userLen < keyW * 2.5f) return emptyList()

                  // مسیر باید دست‌کم از ۳ کلید مختلف عبور کند؛ وگرنه لغزش انگشت هنگام تایپ است
                  val visited = HashSet<Char>()
                  for (pt in path) {
                      for ((c, r) in keys) if (r.contains(pt.x, pt.y)) { visited.add(c); break }
                  }
                  if (visited.size < 3) return emptyList()
                  val user = resample(path, N)

                  fun nearest(p: PointF): Set<Char> =
                      centers.entries
                          .sortedBy { hypot(it.value.x - p.x, it.value.y - p.y) }
                          .take(3).map { it.key }.toSet()

                  val starts = nearest(path.first())
                  val ends = nearest(path.last())

                  val best = ArrayList<Pair<Float, String>>()

                  fun consider(e: Entry) {
                      val k = e.keys
                      if (k[0] !in starts || k[k.length - 1] !in ends) return
                      val pts = ArrayList<PointF>(k.length)
                      for (ch in k) {
                          val c = centers[ch] ?: return
                          if (pts.isEmpty() || pts[pts.size - 1] !== c) pts.add(c)
                      }
                      if (pts.size < 2) return
                      val idealLen = pathLength(pts)
                      if (idealLen < userLen * 0.45f || idealLen > userLen * 1.8f) return
                      val ideal = resample(pts, N)
                      var d = 0f
                      for (i in 0 until N) d += hypot(user[i].x - ideal[i].x, user[i].y - ideal[i].y)
                      d = d / N / keyW
                      if (d > 2.0f) return
                      val cost = d + 0.5f * (ln(1.0 + e.rank) / ln(60000.0)).toFloat()
                      best.add(cost to e.word)
                  }

                  // کلمه‌های جمله‌های ذخیره‌شده‌ی خود کاربر بدون جریمه‌ی رتبه
                  extraPhrases
                      .flatMap { it.split(Regex("[^\\p{L}']+")) }
                      .filter { it.length >= 2 }
                      .distinct()
                      .forEach { w -> keysOf(w, fa)?.let { consider(Entry(w, it, 0)) } }

                  dict(lang).forEach { consider(it) }

                  best.sortBy { it.first }
                  return best.map { it.second }.distinct().take(3)
              }
          }
