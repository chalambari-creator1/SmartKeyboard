              /** رنگ پس‌زمینه، رنگ تأکید و حالت تک‌دست را از تنظیمات اعمال می‌کند. */
              private fun applyChrome() {
                  val root = rootView ?: return
                  if (!::suggestionBar.isInitialized || !::keysArea.isInitialized) return
                  root.setBackgroundColor(cBg)
                  keysArea.trailColor = accent
                  val mode = KbSettings.oneHand(this)
                  val screenW = resources.displayMetrics.widthPixels
                  val w = if (mode == 0) LinearLayout.LayoutParams.MATCH_PARENT else (screenW * 0.8f).toInt()
                  val g = when (mode) {
                      1 -> Gravity.LEFT
                      2 -> Gravity.RIGHT
                      else -> Gravity.NO_GRAVITY
                  }
                  (suggestionBar.layoutParams as? LinearLayout.LayoutParams)?.let { it.width = w; it.gravity = g }
                  (keysArea.layoutParams as? LinearLayout.LayoutParams)?.let { it.width = w; it.gravity = g }
                  suggestionBar.requestLayout()
                  keysArea.requestLayout()
              }

