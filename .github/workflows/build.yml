                  val v = keyWithAlt(disp(shown), hintChar?.let { disp(it) }, 20f, longChar?.toString()) {
                      type(shown.toString())
                      if (shift) { shift = false; showLetters() }
                  }
                  v.tag = base   // برای تشخیص موقعیت حروف در سوایپ
                  return v
              }

              /** کلید با حرف جایگزین: نگه‌داشتن کلید، حرف کوچک گوشه‌ی کلید را وارد می‌کند. */
              private fun keyWithAlt(
                  label: String, hint: String?, size: Float, longPress: String? = hint, onClick: () -> Unit
              ): View {
                  val btn = key(label, size, false, onClick)
                  if (longPress != null) btn.setOnLongClickListener { feedback(); type(longPress); true }
                  if (hint == null) return btn
                  val frame = FrameLayout(this)
                  frame.addView(btn, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT
                  ))
                  frame.addView(TextView(this).apply {
                      text = hint
                      textSize = 10f
                      setTextColor(cHint)
                  }, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT,
                      Gravity.TOP or Gravity.START
                  ).apply { setMargins(dp(6), dp(2), 0, 0) })
                  return frame
              }

              // ---- صفحه‌ی اعداد (درشت؛ همیشه اعداد لاتین) ----
              private fun showNumbers() {
                  resetKeys(false)
                  val h = 66
                  val ts = 30f
                  val d = "1234567890"
                  val comma = if (fa) "،" else ","

                  fun digitRow(a: Char, b: Char, c: Char, lastLabel: String, lastAction: () -> Unit) {
                      val line = newRow(h)
                      line.addView(key(a.toString(), ts) { type(a.toString()) }, weight(1f))
                      line.addView(key(b.toString(), ts) { type(b.toString()) }, weight(1f))
                      line.addView(key(c.toString(), ts) { type(c.toString()) }, weight(1f))
                      val special = lastLabel.length == 1 || lastLabel == "فاصله" || lastLabel == "space"
                      line.addView(key(lastLabel, if (lastLabel.length > 1) 18f else ts, special) { lastAction() }, weight(1f))
                      keysArea.addView(line)
                  }

                  digitRow(d[0], d[1], d[2], "⌫") { backspace() }
                  digitRow(d[3], d[4], d[5], "↵") { enter() }
                  digitRow(d[6], d[7], d[8], if (fa) "فاصله" else "space") { type(" ") }

                  val last = newRow(h)
                  last.addView(key(if (fa) "ابج" else "ABC", 18f, true) { showLetters() }, weight(1f))
                  last.addView(key(d[9].toString(), ts) { type(d[9].toString()) }, weight(1f))
                  last.addView(key(comma, ts) { type(comma) }, weight(1f))
                  last.addView(key(".", ts) { type(".") }, weight(1f))
                  keysArea.addView(last)
              }

              // ---- ورودی ----
              /** اعداد فارسی/عربی همیشه به لاتین تبدیل می‌شوند */
              private fun normalizeDigits(s: String): String = buildString {
                  for (ch in s) {
                      append(
                          when (ch) {
                              in '۰'..'۹' -> '0' + (ch - '۰')
                              in '٠'..'٩' -> '0' + (ch - '٠')
                              else -> ch
                          }
                      )
                  }
              }

              private fun type(text: String) {
                  if (searchMode) { searchQuery += text; updateSuggestions(); return }
                  swipeChips = emptyList()
                  currentInputConnection?.commitText(normalizeDigits(text), 1)
                  if (text.length == 1 && isDelim(text[0])) {
                      learnFromContext(SENTENCE_END.indexOf(text[0]) >= 0, true)
                  }
                  updateSuggestions()
              }

              private fun backspace() {
                  if (searchMode) { searchQuery = searchQuery.dropLast(1); updateSuggestions(); return }
                  swipeChips = emptyList()
                  val ic = currentInputConnection ?: return
                  val selected = ic.getSelectedText(0)
                  if (!selected.isNullOrEmpty()) {
                      ic.commitText("", 1)                       // متن انتخاب‌شده پاک می‌شود
                  } else {
                      ic.deleteSurroundingTextInCodePoints(1, 0) // یک کاراکتر (ایموجی هم کامل پاک می‌شود)
                  }
                  updateSuggestions()
              }

              private fun enter() {
                  if (searchMode) { exitSearch(); return }
                  learnFromContext(true, false)
                  swipeChips = emptyList()
                  currentInputConnection?.apply {
                      sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER))
                      sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER))
                  }
                  updateSuggestions()
              }

              // ---- یادگیری کلمه‌ها و جمله‌های کاربر ----
              private class Sug(val text: String, val onClick: () -> Unit)

              private val TOKEN_SPLIT = Regex("[^\\p{L}\\u200c]+")
              private var lastPrune = 0L

              private fun cleanWord(raw: String): String? {
                  val w = raw.trim('\u200c').replace('ي', 'ی').replace('ك', 'ک').lowercase()
                  if (w.length < 2 || w.length > 24) return null
                  for (ch in w) if (!(ch.isLetter() || ch == '\u200c')) return null
                  return w
              }

              private fun isDelim(c: Char) = " .،,؟?!؛;:".indexOf(c) >= 0

              /**
               * بعد از نوشتن یک جداکننده (فاصله، نقطه، اینتر...) آخرین کلمه، ترکیب «کلمه‌ی قبلی ← این کلمه»
               * و در پایان جمله، خود جمله را یاد می‌گیرد.
               */
              private fun learnFromContext(sentenceEnded: Boolean, delimCommitted: Boolean) {
                  if (!learningEnabled || !KbSettings.learn(this)) return
                  try {
                      val ic = currentInputConnection ?: return
                      val before = ic.getTextBeforeCursor(200, 0)?.toString() ?: return
                      val body = if (delimCommitted) before.dropLast(1) else before
                      if (body.isEmpty() || !body.last().isLetter()) return
                      val seg = currentSegment(body)
                      val tokens = seg.split(TOKEN_SPLIT).filter { it.isNotEmpty() }
                      val last = cleanWord(tokens.lastOrNull() ?: return) ?: return
                      store.learnWord(last)
                      val prev = if (tokens.size >= 2) cleanWord(tokens[tokens.size - 2]) else null
                      if (prev != null) store.learnBigram(prev, last)
                      val truncated = body.length >= 200 && seg.length == body.length
                      if (sentenceEnded && !truncated) learnSentence(seg)
                  } catch (e: Exception) {
                      // یادگیری مهم‌تر از خطا نیست؛ نادیده گرفته می‌شود
                  }
              }

              /** جمله‌ای که ۳ بار نوشته شود، خودکار به جمله‌های ذخیره‌شده اضافه می‌شود. */
              private fun learnSentence(raw: String) {
                  val t = normalizeDigits(raw).trim().replace(Regex("\\s+"), " ")
                  if (t.length < 6 || t.length > 120) return
                  if (t.split(" ").size < 2) return
                  if (LONG_DIGITS.containsMatchIn(t)) return
                  if (store.learnSentence(t) >= 3) store.add(t)
              }

              private fun pruneIfNeeded() {
                  val now = System.currentTimeMillis()
                  if (now - lastPrune < 6 * 3_600_000L) return
                  lastPrune = now
                  try { store.pruneLearning() } catch (e: Exception) { }
              }

              private fun applyWord(partialLen: Int, w: String) {
                  val ic = currentInputConnection ?: return
                  swipeChips = emptyList()
                  if (partialLen > 0) ic.deleteSurroundingText(partialLen, 0)
                  ic.commitText("$w ", 1)
                  learnFromContext(false, true)
                  updateSuggestions()
              }

              // ---- لرزش و صدای کلید ----
              private fun feedback() {
                  if (KbSettings.vibrate(this)) {
                      val v = vibrator
                      if (v != null && v.hasVibrator()) {
                          if (Build.VERSION.SDK_INT >= 26) {
                              v.vibrate(VibrationEffect.createOneShot(18, VibrationEffect.DEFAULT_AMPLITUDE))
                          } else {
                              @Suppress("DEPRECATION")
                              v.vibrate(18)
                          }
                      }
                  }
                  if (KbSettings.sound(this)) audio?.playSoundEffect(AudioManager.FX_KEYPRESS_STANDARD, -1f)
              }

              // ---- حرکت مکان‌نما و انتخاب ----
              private fun sendDpad(code: Int, withShift: Boolean) {
                  val ic = currentInputConnection ?: return
                  val meta = if (withShift) KeyEvent.META_SHIFT_ON else 0
                  val t = SystemClock.uptimeMillis()
                  ic.sendKeyEvent(KeyEvent(t, t, KeyEvent.ACTION_DOWN, code, 0, meta))
                  ic.sendKeyEvent(KeyEvent(t, t, KeyEvent.ACTION_UP, code, 0, meta))
              }

              /**
               * ناحیه‌ای که با کشیدن انگشت روی آن، مکان‌نما حرکت می‌کند (به چپ و راست).
               * اگر withShift درست باشد، به‌جای حرکت، متن انتخاب می‌شود.
               */
              private fun attachDragCursor(view: View, withShift: () -> Boolean, onTap: (() -> Unit)?) {
                  val step = dp(14).toFloat()
                  val threshold = dp(12).toFloat()
                  var downX = 0f
                  var lastX = 0f
                  var moved = false
                  view.setOnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              v.isPressed = true
                              v.parent?.requestDisallowInterceptTouchEvent(true)
                              downX = e.x
                              lastX = e.x
                              moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              if (!moved && Math.abs(e.x - downX) > threshold) {
                                  moved = true
                                  lastX = e.x
                              }
                              if (moved) {
                                  var d = e.x - lastX
                                  while (Math.abs(d) >= step) {
                                      sendDpad(
                                          if (d > 0) KeyEvent.KEYCODE_DPAD_RIGHT else KeyEvent.KEYCODE_DPAD_LEFT,
                                          withShift()
                                      )
                                      lastX += if (d > 0) step else -step
                                      d = e.x - lastX
                                  }
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              v.isPressed = false
                              if (!moved) { feedback(); onTap?.invoke() } else { swipeChips = emptyList(); updateSuggestions() }
                          }
                          MotionEvent.ACTION_CANCEL -> v.isPressed = false
                      }
                      true
                  }
              }

              private fun spaceKey(label: String): Button {
                  val b = key(label, 15f) {}
                  attachDragCursor(b, { false }) { type(" ") }
                  return b
              }

              private fun openSettings() {
                  try {
                      startActivity(Intent(this, SettingsActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  } catch (e: Exception) {
                      flash("باز کردن تنظیمات ممکن نشد")
                  }
              }

              // ---- متن فیلد / ذخیره‌ی دستی ----
              /** متن جمله‌ی جاری: از آخرین نقطه/علامت پایان جمله یا خط جدید تا مکان‌نما */
              private fun currentSegment(before: String): String {
                  val idx = before.indexOfLast { it == '\n' || SENTENCE_END.contains(it) }
                  return if (idx >= 0) before.substring(idx + 1) else before
              }

              /** متن انتخاب‌شده؛ اگر چیزی انتخاب نشده باشد، کل متن داخل فیلد. */
              private fun readFieldText(): String {
                  val ic = currentInputConnection ?: return ""
                  val selected = ic.getSelectedText(0)?.toString()
                  return (
                      if (!selected.isNullOrBlank()) selected
                      else ic.getTextBeforeCursor(300, 0)?.toString().orEmpty() +
                          ic.getTextAfterCursor(300, 0)?.toString().orEmpty()
                  ).trim()
              }

              private fun saveCurrent() {
                  if (!learningEnabled) { flash("اینجا ذخیره نمی‌شود"); return }
                  val text = normalizeDigits(readFieldText())
                  when {
                      text.length < 2 -> flash("اول متن را بنویس، بعد ⭐")
                      text.length > 200 -> flash("متن خیلی بلند است (حداکثر ۲۰۰ حرف)")
                      LONG_DIGITS.containsMatchIn(text) -> flash("شماره‌ی بلند را از 💳 ذخیره کن")
                      store.add(text) -> flash("✓ ذخیره شد")
                      else -> flash("قبلاً ذخیره شده")
                  }
              }

              private fun flash(msg: String) {
                  if (!::suggestionBar.isInitialized) return
                  suggestionBar.removeAllViews()
                  suggestionBar.addView(TextView(this).apply {
                      text = msg
                      setTextColor(if (dark) 0xFFFFEB3B.toInt() else 0xFF8A5A00.toInt())
                      textSize = 14f
                      gravity = Gravity.CENTER
                  }, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.MATCH_PARENT
                  ))
                  handler.removeCallbacks(flashReset)
                  handler.postDelayed(flashReset, 1800)
              }

              // ---- کلیپ‌بورد ----
              private var lastClipStatus = ""

              private val clipPoll = object : Runnable {
                  override fun run() {
                      captureClip()
                      handler.postDelayed(this, 1500)
                  }
              }

              /** آخرین کپی را در تاریخچه می‌گذارد. اگر نشد، علتش در lastClipStatus می‌ماند. */
              private fun captureClip(): Boolean {
                  try {
                      val cm = clipboard
                      if (cm == null) { lastClipStatus = "سرویس کلیپ‌بورد در دسترس نیست"; return false }
                      if (!cm.hasPrimaryClip()) { lastClipStatus = "چیزی کپی نشده است"; return false }
                      val clip = cm.primaryClip
                      if (clip == null) { lastClipStatus = "اندروید اجازه‌ی خواندن کلیپ‌بورد را نداد"; return false }
                      if (clip.itemCount == 0) { lastClipStatus = "محتوای کپی‌شده خالی است"; return false }
                      // محتوایی که خود برنامه «حساس» علامت زده (مثل رمزها) ذخیره نمی‌شود
                      if (Build.VERSION.SDK_INT >= 33 &&
                          clip.description.extras?.getBoolean("android.content.extra.IS_SENSITIVE", false) == true
                      ) { lastClipStatus = "آخرین کپی «حساس» علامت خورده و ذخیره نمی‌شود"; return false }
                      val t = clip.getItemAt(0).coerceToText(this)?.toString()?.trim().orEmpty()
                      if (t.isEmpty()) { lastClipStatus = "آخرین کپی متن نیست"; return false }
                      if (t.length > 2000) { lastClipStatus = "آخرین کپی خیلی بلند است (بیش از ۲۰۰۰ حرف)"; return false }
                      store.clipAdd(t, KbSettings.clipTtlHours(this))
                      lastClipStatus = ""
                      return true
                  } catch (e: Exception) {
                      lastClipStatus = "خطا در خواندن کلیپ‌بورد: " + (e.message ?: e.javaClass.simpleName)
                      return false
                  }
              }

              // ---- نوار بالا: ابزارها یا پیشنهادها ----
              private fun addToolbar() {
                  fun tool(icon: String, action: () -> Unit) {
                      val b = Button(this).apply {
                          text = icon
                          textSize = 18f
                          isAllCaps = false
                          minWidth = 0
                          minimumWidth = 0
                          minHeight = 0
                          minimumHeight = 0
                          setPadding(0, 0, 0, 0)
                          setBackgroundColor(Color.TRANSPARENT)
                          stateListAnimator = null
                          setTextColor(cText)
                          setOnClickListener { feedback(); action() }
                      }
                      suggestionBar.addView(b, weight(1f))
                  }
                  tool("😀") { showEmoji() }
                  tool("📋") { showClips() }
                  tool("📝") { showSaved() }
                  tool("⭐") { saveCurrent() }
                  tool("✂️") { showEdit() }
                  tool("🔢") { showNumbers() }
                  tool("💳") { showVault() }
                  tool("🔑") { showCodes() }
                  tool("⚙️") { openSettings() }
              }

              private fun updateSuggestions() {
                  if (!::suggestionBar.isInitialized) return
                  suggestionBar.removeAllViews()

                  if (searchMode) { renderSearchBar(); return }

                  // بعد از سوایپ: کلمه‌های محتمل (لمس هر کدام، کلمه‌ی وارد‌شده را عوض می‌کند)
                  if (swipeChips.isNotEmpty()) {
                      swipeChips.forEach { w ->
                          suggestionBar.addView(TextView(this).apply {
                              text = w
                              setTextColor(cText)
                              background = roundBg(cKey)
                              textSize = 16f
                              gravity = Gravity.CENTER
                              maxLines = 1
                              ellipsize = TextUtils.TruncateAt.END
                              setPadding(dp(8), 0, dp(8), 0)
                              setOnClickListener { applySwipeChoice(w) }
                          }, weight(1f))
                      }
                      return
                  }

                  if (!learningEnabled) { addToolbar(); return }

                  val before = currentInputConnection?.getTextBeforeCursor(200, 0)?.toString().orEmpty()
                  val line = before.substringAfterLast('\n')

                  // کد/شماره‌ی تازه از اعلان‌ها: وقتی فیلد خالی است، با یک ضربه وارد و کپی می‌شود
                  if (before.isBlank() && KbSettings.codes(this)) {
                      val fresh = CodeInbox.fresh().take(2)
                      if (fresh.isNotEmpty()) {
                          fresh.forEach { it0 ->
                              suggestionBar.addView(TextView(this).apply {
                                  text = "🔑 " + it0.value
                                  setTextColor(0xFFFFFFFF.toInt())
                                  background = roundBg(accent)
                                  textSize = 17f
                                  gravity = Gravity.CENTER
                                  maxLines = 1
                                  setPadding(dp(8), 0, dp(8), 0)
                                  setOnClickListener {
                                      feedback()
                                      copyText(it0.value)
                                      currentInputConnection?.commitText(it0.value, 1)
                                      CodeInbox.dismissFresh()
                                      updateSuggestions()
                                  }
                              }, weight(1.5f))
                          }
                          suggestionBar.addView(key("✕", 16f, true) {
                              CodeInbox.dismissFresh()
                              updateSuggestions()
                          }, weight(0.6f))
                          return
                      }
                  }

                  // اول با کل خط تطبیق می‌دهیم، بعد با جمله‌ی جاری
                  var raw = ""
                  var found: List<String> = emptyList()
                  for (cand in listOf(line, currentSegment(before)).distinct()) {
                      val p = cand.trimStart()
                      if (p.length < 2) continue
                      val r = store.suggest(p, 3)
                      if (r.isNotEmpty()) { raw = cand; found = r; break }
                  }

                  // پیشنهاد کلمه: تکمیل کلمه‌ی نیمه‌کاره، یا کلمه‌ی بعدی بعد از فاصله
                  val phrases = found.map { s -> Sug(s) { applySuggestion(raw, s) } }
                  val wordSugs = ArrayList<Sug>()
                  if (KbSettings.learn(this)) {
                      val tail = before.takeLastWhile { it.isLetter() || it == '\u200c' }
                      if (tail.length >= 2) {
                          store.suggestWords(tail, 3).forEach { w -> wordSugs.add(Sug(w) { applyWord(tail.length, w) }) }
                      } else if (tail.isEmpty() && before.endsWith(" ") && !before.endsWith("  ")) {
                          val prev = currentSegment(before).split(TOKEN_SPLIT).filter { it.isNotEmpty() }
                              .lastOrNull()?.let { cleanWord(it) }
                          if (prev != null) store.nextWords(prev, 3).forEach { w -> wordSugs.add(Sug(w) { applyWord(0, w) }) }
                      }
                  }
                  val sugs = ArrayList<Sug>()
                  sugs.addAll(phrases.take(2))
                  wordSugs.filter { w -> sugs.none { it.text == w.text } }.take(3 - sugs.size).forEach { sugs.add(it) }
                  if (sugs.size < 3) sugs.addAll(phrases.drop(2).take(3 - sugs.size))

                  if (sugs.isEmpty()) { addToolbar(); return }

                  sugs.forEach { sg ->
                      suggestionBar.addView(TextView(this).apply {
                          text = sg.text
                          setTextColor(cText)
                          background = roundBg(cKey)
                          textSize = 15f
                          gravity = Gravity.CENTER
                          maxLines = 1
                          ellipsize = TextUtils.TruncateAt.END
                          setPadding(dp(8), 0, dp(8), 0)
                          setOnClickListener { sg.onClick() }
                      }, weight(1f))
                  }
              }

              private fun applySuggestion(raw: String, phrase: String) {
                  val ic = currentInputConnection ?: return
                  val lead = raw.takeWhile { it == ' ' }
                  ic.deleteSurroundingText(raw.length, 0)
                  ic.commitText(lead + phrase, 1)
                  store.use(phrase)
                  updateSuggestions()
              }

              // ---- صفحه‌های فهرست (جمله‌ها / کلیپ‌بورد / گاوصندوق) ----
              private class Row(val key: String, val label: String, val pinned: Boolean = false)

              private fun showListPage(
                  emptyMsg: String,
                  rows: List<Row>,
                  onPick: (Row) -> Unit,
                  onDelete: (Row) -> Unit,
                  extraLabel: String? = null,
                  onExtra: (() -> Unit)? = null,
                  onPin: ((Row) -> Unit)? = null,
                  pinLabel: String = "📌"
              ) {
                  resetKeys(false)
                  val list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  if (rows.isEmpty()) {
                      list.addView(TextView(this).apply {
                          text = emptyMsg
                          setTextColor(cHint)
                          textSize = 15f
                          gravity = Gravity.CENTER
                      }, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(120)))
                  }
                  rows.forEach { r ->
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutDirection = View.LAYOUT_DIRECTION_LTR
                      }
                      row.addView(key("🗑", 16f, true) { onDelete(r) }, smallKeyParams())
                      if (onPin != null) {
                          val pin = key(pinLabel, 16f, true) { onPin(r) }
                          if (r.pinned) pin.background = keyBg(accent, cPressed)
                          row.addView(pin, smallKeyParams())
                      }
                      val k = key(r.label, 15f) { onPick(r) }.apply {
                          maxLines = 1
                          ellipsize = TextUtils.TruncateAt.END
                          setPadding(dp(10), 0, dp(10), 0)
                      }
                      row.addView(k, weight(1f))
                      list.addView(row, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(50)))
                  }

                  val scroll = ScrollView(this)
                  scroll.addView(list)
                  keysArea.addView(scroll, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(200)))

                  val bottom = newRow(52)
                  bottom.addView(key(if (fa) "ابج" else "ABC", 18f, true) { showLetters(); updateSuggestions() }, weight(1f))
                  if (extraLabel != null && onExtra != null) {
                      bottom.addView(key(extraLabel, 14f) { onExtra() }, weight(2.2f))
                  }
                  keysArea.addView(bottom)
              }

              private fun commitAndClose(text: String) {
                  currentInputConnection?.commitText(text, 1)
                  showLetters()
                  updateSuggestions()
              }

              private fun showSaved() {
                  showListPage(
                      "هنوز چیزی ذخیره نکرده‌ای.\nمتن را بنویس و ⭐ را بزن.",
                      store.all().map { Row(it, it) },
                      onPick = { store.use(it.key); commitAndClose(it.key) },
                      onDelete = { store.delete(it.key); showSaved() }
                  )
              }

              private fun showClips() {
                  store.clipExpire(KbSettings.clipTtlHours(this))
                  val ok = captureClip()
                  val rows = store.clipItems().map { (t, pinned) -> Row(t, t.replace("\n", " "), pinned) }
                  val empty = "کلیپ‌بورد خالی است.\n" +
                      (if (lastClipStatus.isNotEmpty()) lastClipStatus else "چیزی را کپی کن تا اینجا بیاید.")
                  showListPage(
                      empty,
                      rows,
                      onPick = { r -> commitAndClose(r.key) },
                      onDelete = { r -> store.clipDelete(r.key); showClips() },
                      extraLabel = "پاک‌کردن بقیه (پین‌ها می‌مانند)",
                      onExtra = { store.clipClear(); showClips() },
                      onPin = { r -> store.clipSetPinned(r.key, !r.pinned); showClips() }
                  )
                  // اگر خواندن کلیپ‌بورد مشکل داشت، علتش بالای کیبورد هم نشان داده می‌شود
                  if (!ok && lastClipStatus.isNotEmpty() && rows.isNotEmpty()) flash(lastClipStatus)
              }

              private fun showVault() {
                  showListPage(
                      "گاوصندوق خالی است.\nشماره را بنویس و «افزودن» را بزن.",
                      store.vaultList().map { Row(it.first.toString(), it.second) },
                      onPick = { r ->
                          val secret = store.vaultSecret(r.key.toLong())
                          if (secret != null) commitAndClose(secret) else flash("خواندن ناموفق بود")
                      },
                      onDelete = { store.vaultDelete(it.key.toLong()); showVault() },
                      extraLabel = "➕ افزودن از متن فیلد",
                      onExtra = { addToVault() }
                  )
              }

              private fun copyText(t: String) {
                  try {
                      val clip = android.content.ClipData.newPlainText("kb", t)
                      if (Build.VERSION.SDK_INT >= 33) {
                          clip.description.extras = android.os.PersistableBundle().apply {
                              putBoolean("android.content.extra.IS_SENSITIVE", true)
                          }
                      }
                      clipboard?.setPrimaryClip(clip)
                  } catch (e: Exception) { }
              }

              private fun showCodes() {
                  showListPage(
                      "هنوز کد یا شماره‌ای نرسیده.\nدر تنظیمات کیبورد «دسترسی به اعلان‌ها» را روشن کن.",
                      CodeInbox.recent().map { Row(it.value, it.kind + ": " + it.value) },
                      onPick = { r -> copyText(r.key); commitAndClose(r.key) },
                      onDelete = { r -> CodeInbox.remove(r.key); showCodes() },
                      extraLabel = "پاک‌کردن همه",
                      onExtra = { CodeInbox.clear(); showCodes() },
                      onPin = { r -> copyText(r.key); flash("✓ کپی شد") },
                      pinLabel = "📋"
                  )
              }

              private fun addToVault() {
                  if (!learningEnabled) { flash("اینجا ذخیره نمی‌شود"); return }
                  val text = normalizeDigits(readFieldText())
                  if (text.length < 2) { flash("اول شماره را در فیلد بنویس"); return }
                  if (text.length > 64) { flash("حداکثر ۶۴ حرف"); return }
                  store.vaultAdd(vaultLabel(text), text)
                  flash("✓ در گاوصندوق ذخیره شد")
                  showVault()
              }

              private fun vaultLabel(text: String): String {
                  val digits = text.filter { it in '0'..'9' }
                  return if (digits.length in 13..19 && digits.length >= text.length - 4) {
                      "کارت ····" + digits.takeLast(4)
                  } else {
                      text.take(14) + if (text.length > 14) "…" else ""
                  }
              }

              // ---- صفحه‌ی ایموجی ----
              private fun recentEmoji(): List<String> =
                  prefs.getString("recent_emoji", "").orEmpty().split(" ").filter { it.isNotEmpty() }

              private fun addRecentEmoji(e: String) {
                  val list = (listOf(e) + recentEmoji().filter { it != e }).take(24)
                  prefs.edit().putString("recent_emoji", list.joinToString(" ")).apply()
              }

              private fun showEmoji() {
                  resetKeys(false)

                  // تب‌های دسته‌بندی
                  val tabs = newRow(44)
                  EMOJI_CATS.forEachIndexed { i, c ->
                      val t = Button(this).apply {
                          text = c.first
                          textSize = 20f
                          isAllCaps = false
                          minWidth = 0
                          minimumWidth = 0
                          minHeight = 0
                          minimumHeight = 0
                          setPadding(0, 0, 0, 0)
                          stateListAnimator = null
                          setTextColor(cText)
                          if (i == emojiCat) background = roundBg(cSpecial) else setBackgroundColor(Color.TRANSPARENT)
                          setOnClickListener { emojiCat = i; showEmoji() }
                      }
                      tabs.addView(t, weight(1f))
                  }
                  // تب جستجو با کلمه‌ی فارسی
                  tabs.addView(Button(this).apply {
                      text = "🔍"
                      textSize = 20f
                      isAllCaps = false
                      minWidth = 0
                      minimumWidth = 0
                      minHeight = 0
                      minimumHeight = 0
                      setPadding(0, 0, 0, 0)
                      stateListAnimator = null
                      setTextColor(cText)
                      setBackgroundColor(Color.TRANSPARENT)
                      setOnClickListener { startEmojiSearch() }
                  }, weight(1f))
                  keysArea.addView(tabs)

                  // شبکه‌ی ایموجی‌ها (۸ تا در هر ردیف)
                  val items = if (emojiCat == 0) recentEmoji()
                  else EMOJI_CATS[emojiCat].second.split(" ").filter { it.isNotEmpty() }

                  val grid = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  if (items.isEmpty()) {
                      grid.addView(TextView(this).apply {
                          text = "هنوز ایموجی‌ای استفاده نکرده‌ای."
                          setTextColor(cHint)
                          textSize = 15f
                          gravity = Gravity.CENTER
                      }, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(120)))
                  }
                  items.chunked(8).forEach { chunk ->
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutDirection = View.LAYOUT_DIRECTION_LTR
                      }
                      chunk.forEach { e ->
                          row.addView(TextView(this).apply {
                              text = e
                              textSize = 26f
                              gravity = Gravity.CENTER
                              setOnClickListener {
                                  currentInputConnection?.commitText(e, 1)
                                  addRecentEmoji(e)
                              }
                          }, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1f))
                      }
                      repeat(8 - chunk.size) {
                          row.addView(View(this), LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1f))
                      }
                      grid.addView(row, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(46)))
                  }
                  val scroll = ScrollView(this)
                  scroll.addView(grid)
                  keysArea.addView(scroll, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(176)))

                  // ردیف پایین: برگشت، فاصله، پاک‌کردن
                  val bottom = newRow(52)
                  bottom.addView(key(if (fa) "ابج" else "ABC", 18f, true) { showLetters(); updateSuggestions() }, weight(1.5f))
                  bottom.addView(key(if (fa) "فارسی" else "English", 15f) { type(" ") }, weight(4f))
                  bottom.addView(repeatKey("⌫", 20f) { backspace() }, weight(1.5f))
                  keysArea.addView(bottom)
              }

              // ---- جستجوی ایموجی ----
              private fun startEmojiSearch() {
                  searchMode = true
                  searchQuery = ""
                  lang = "fa"
                  shift = false
                  showLetters()
                  updateSuggestions()
              }

              private fun exitSearch() {
                  searchMode = false
                  searchQuery = ""
                  showEmoji()
                  updateSuggestions()
              }

              private fun renderSearchBar() {
                  suggestionBar.addView(key("✕", 16f, true) { exitSearch() }, weight(0.7f))
                  suggestionBar.addView(TextView(this).apply {
                      text = if (searchQuery.isEmpty()) "🔍 بنویس: خنده، قلب…" else searchQuery
                      setTextColor(if (searchQuery.isEmpty()) cHint else cText)
                      background = roundBg(cKey)
                      textSize = 15f
                      gravity = Gravity.CENTER
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.START
                      setPadding(dp(6), 0, dp(6), 0)
