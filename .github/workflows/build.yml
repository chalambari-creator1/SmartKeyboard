              private class E(val emoji: String, val keys: String)

              private val DATA: List<E> by lazy {
                  RAW.lines().mapNotNull { line ->
                      val i = line.indexOf('|')
                      if (i <= 0) null else E(line.substring(0, i).trim(), norm(line.substring(i + 1)))
                  }
              }

              /** یکسان‌سازی حروف عربی/فارسی و حذف نیم‌فاصله و فاصله */
              private fun norm(s: String): String = buildString {
                  for (ch in s) {
                      when (ch) {
                          'ي', 'ى' -> append('ی')
                          'ك' -> append('ک')
                          '\u200c', '-' -> {}
                          else -> append(ch)
                      }
                  }
              }.trim()

              fun search(query: String, limit: Int = 40): List<String> {
                  val q = norm(query).replace(" ", "")
                  if (q.isEmpty()) return emptyList()
                  val exact = ArrayList<String>()
                  val partial = ArrayList<String>()
                  for (e in DATA) {
                      val words = e.keys.split(" ").map { it.trim() }.filter { it.isNotEmpty() }
                      when {
                          e.emoji == query.trim() -> exact.add(e.emoji)
                          words.any { it == q } -> exact.add(e.emoji)
                          words.any { it.startsWith(q) } -> partial.add(e.emoji)
                          words.any { it.contains(q) } && q.length >= 2 -> partial.add(e.emoji)
                      }
                  }
                  return (exact + partial).distinct().take(limit)
              }
          }
