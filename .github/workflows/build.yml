              private fun editCopy(cut: Boolean) {
                  val ic = currentInputConnection ?: return
                  val selected = ic.getSelectedText(0)
                  if (selected.isNullOrEmpty()) { flash("اول متن را انتخاب کن"); return }
                  val txt = selected.toString()
                  try {
                      clipboard?.setPrimaryClip(android.content.ClipData.newPlainText("kb", txt))
                  } catch (e: Exception) {
                      ic.performContextMenuAction(if (cut) android.R.id.cut else android.R.id.copy)
                  }
                  if (cut) ic.commitText("", 1)
                  captureClip()
                  flash(if (cut) "✓ بریده شد" else "✓ کپی شد")
              }

              private fun editPaste() {
                  val ic = currentInputConnection ?: return
                  val t = try {
                      clipboard?.primaryClip?.getItemAt(0)?.coerceToText(this)?.toString().orEmpty()
                  } catch (e: Exception) { "" }
                  if (t.isNotEmpty()) ic.commitText(t, 1) else flash("چیزی برای چسباندن نیست")
              }

              // ---- سوایپ ----
              private fun handleSwipe(path: List<PointF>, keys: List<Pair<Char, RectF>>) {
                  val language = lang
                  val extra = store.all() + store.topWords(3000)
                  executor.execute {
                      val words = try {
                          decoder.decode(language, path, keys, extra)
                      } catch (e: Exception) {
                          emptyList()
                      }
                      handler.post { applySwipeResult(words) }
                  }
              }

              private fun applySwipeResult(words: List<String>) {
                  if (words.isEmpty()) { flash(if (fa) "کلمه‌ای پیدا نشد" else "No word found"); return }
                  val ic = currentInputConnection ?: return
                  val list = if (shift && !fa) words.map { w -> w.replaceFirstChar { it.uppercaseChar() } } else words
                  if (shift) { shift = false; showLetters() }

                  // اگر درست بعد از یک حرف هستیم، اول یک فاصله بگذار
                  val prev = ic.getTextBeforeCursor(1, 0)?.toString().orEmpty()
                  val prefix = if (prev.isNotEmpty() && !prev[0].isWhitespace()) " " else ""

                  ic.commitText(prefix + list[0] + " ", 1)
                  learnFromContext(false, true)
                  swipeCommitted = list[0]
                  swipeChips = list
                  updateSuggestions()
              }

              private fun applySwipeChoice(w: String) {
                  val ic = currentInputConnection ?: return
                  ic.deleteSurroundingText(swipeCommitted.length + 1, 0)
                  ic.commitText("$w ", 1)
                  swipeCommitted = w
                  updateSuggestions()
              }

              private fun resetKeys(swipe: Boolean) {
                  keysArea.removeAllViews()
                  keysArea.swipeEnabled = swipe
              }

              // ---- صفحه‌ی نمادها (!#1) مثل سامسونگ؛ دو صفحه: 1/2 و 2/2 ----
              private fun showSymbols(page: Int) {
                  resetKeys(false)
                  val rowB: List<String>
                  val rowC: List<String>
                  val rowD: List<String>
                  if (page == 1) {
                      rowB = listOf("+", "×", "÷", "=", "/", "_", "<", ">", "[", "]")
                      rowC = listOf("!", "@", "#", "﷼", "%", "^", "&", "*", "(", ")")
                      rowD = listOf("-", "'", "\"", ":", "؛", "،", "؟")
                  } else {
                      rowB = listOf("`", "~", "\\", "|", "{", "}", "€", "£", "¥", "$")
                      rowC = listOf("°", "•", "○", "●", "□", "■", "♤", "♡", "◇", "♧")
                      rowD = listOf("☆", "▪", "¤", "《", "》", "¡", "¿")
                  }

                  fun symRow(items: List<String>): LinearLayout {
                      val line = newRow(52)
                      items.forEach { c -> line.addView(key(c, 20f) { type(c) }, weight(1f)) }
                      return line
                  }

                  // ردیف اعداد (همیشه لاتین)
                  keysArea.addView(symRow("1234567890".map { it.toString() }))
                  keysArea.addView(symRow(rowB))
                  keysArea.addView(symRow(rowC))

                  val r4 = newRow(52)
                  r4.addView(
                      key(if (page == 1) "1/2" else "2/2", 18f, true) { showSymbols(if (page == 1) 2 else 1) },
                      weight(1.5f)
                  )
                  rowD.forEach { c -> r4.addView(key(c, 20f) { type(c) }, weight(1f)) }
                  r4.addView(repeatKey("⌫", 20f) { backspace() }, weight(1.5f))
                  keysArea.addView(r4)

                  keysArea.addView(bottomRow(if (fa) "اب" else "ABC", 16f, { showLetters(); updateSuggestions() }) {
                      lang = if (fa) "en" else "fa"
                      shift = false
                      showSymbols(page)
                  })
              }

              /**
               * ردیف پایین مثل سامسونگ، متقارن تا کلید فاصله دقیقاً وسط باشد:
               * [چپ][🌐][،] [فاصله] [نیم‌فاصله][.][اینتر]
               */
              private fun bottomRow(leftLabel: String, leftSize: Float, onLeft: () -> Unit, onLang: () -> Unit): LinearLayout {
                  val b = newRow(52)
                  b.addView(key(leftLabel, leftSize, true) { onLeft() }, weight(1.4f))
                  b.addView(key("🌐", 18f, true) { onLang() }, weight(1.1f))
                  b.addView(keyWithAlt(if (fa) "،" else ",", "!", 20f) { type(if (fa) "،" else ",") }, weight(1f))
                  b.addView(spaceKey(if (fa) "فارسی" else "English"), weight(3.5f))
                  if (fa) {
                      // کلید سمت راست فاصله: نیم‌فاصله (ZWNJ)
                      b.addView(key("↔", 18f, true) { type("\u200c") }, weight(1f))
                      b.addView(keyWithAlt(".", "؟", 20f) { type(".") }, weight(1f))
                  } else {
                      b.addView(key("?", 20f) { type("?") }, weight(1f))
                      b.addView(key(".", 20f) { type(".") }, weight(1f))
                  }
                  b.addView(key("↵", 20f, true) { enter() }, weight(1.5f))
                  return b
              }

              // ---- ابزارهای UI ----
              private fun roundBg(color: Int) = GradientDrawable().apply {
                  setColor(color)
                  cornerRadius = dp(9).toFloat()
              }

              private fun keyBg(color: Int, pressed: Int) = StateListDrawable().apply {
                  addState(intArrayOf(android.R.attr.state_pressed), roundBg(pressed))
                  addState(intArrayOf(), roundBg(color))
              }

              private fun newRow(heightDp: Int) = LinearLayout(this).apply {
                  orientation = LinearLayout.HORIZONTAL
                  layoutDirection = View.LAYOUT_DIRECTION_LTR
                  layoutParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, dp((heightDp * KbSettings.heightScale(this@SmartKeyboardService)).toInt())
                  )
              }

              private fun key(label: String, size: Float, special: Boolean = false, onClick: () -> Unit) =
                  Button(this).apply {
                      text = label
                      isAllCaps = false
                      textSize = size
                      minWidth = 0
                      minimumWidth = 0
                      minHeight = 0
                      minimumHeight = 0
                      setPadding(0, 0, 0, 0)
                      setTextColor(cText)
                      background = keyBg(if (special) cSpecial else cKey, cPressed)
                      stateListAnimator = null
                      setOnClickListener { feedback(); onClick() }
                  }

              /** کلیدی که با نگه‌داشتن، مرتب تکرار می‌شود (مثل پاک‌کردن) */
              private fun repeatKey(label: String, size: Float, action: () -> Unit): Button {
                  val b = key(label, size, true) {}
                  val repeater = object : Runnable {
                      override fun run() {
                          action()
                          handler.postDelayed(this, 55)
                      }
                  }
                  b.setOnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              v.isPressed = true
                              feedback()
                              action()
                              handler.postDelayed(repeater, 400)
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              v.isPressed = false
                              handler.removeCallbacks(repeater)
                          }
                      }
                      true
                  }
                  return b
              }

              private fun weight(w: Float) =
                  LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, w).apply {
                      setMargins(dp(3), dp(4), dp(3), dp(0))
                  }

              private fun smallKeyParams() =
                  LinearLayout.LayoutParams(dp(48), LinearLayout.LayoutParams.MATCH_PARENT).apply {
                      setMargins(dp(3), dp(4), dp(3), dp(0))
                  }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
          }
